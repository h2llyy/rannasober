<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#96dedf">
<title>Rannasõbra aardesaar</title>
<style>
:root {
  --ink:#173f4c; --edge:#ba9871; --cream:#fff8e6;
  --sea:#138485; --gold:#ffe38a;
}
* { box-sizing:border-box }
body {
  margin:0; min-height:100vh; min-height:100dvh;
  font:650 17px/1.35 system-ui,sans-serif; color:var(--ink);
  background:#bde9e6; isolation:isolate;
}
button,select { font:inherit; color:inherit }
button {
  background:linear-gradient(155deg,#fffefa,#ffefc9);
  border:2px solid #47716d; border-radius:17px;
  min-height:48px; padding:8px 14px; cursor:pointer;
  box-shadow:inset 0 3px 1px #fffd,0 5px 0 var(--edge),0 8px 15px #19465424;
  touch-action:manipulation; transition:transform .13s,box-shadow .13s;
}
button:active:not(:disabled) {
  transform:translateY(4px) scale(.97);
  box-shadow:inset 0 2px 3px #896c4433,0 1px 0 var(--edge);
}
button:focus-visible,select:focus-visible { outline:4px solid #ad5418;outline-offset:3px }
button:disabled { cursor:default }
main { width:min(94%,900px); margin:auto; padding:14px 0 86px; text-align:center }
h1,h2 { margin:.25em 0; font-family:Georgia,serif; line-height:1.08; text-wrap:balance }
h1 { font-size:clamp(35px,6.8vw,66px); text-shadow:0 2px #fff9 }
h2 { font-size:clamp(25px,4.3vw,40px) }
p { margin:.45em 0 }
header,.row,.tools,.slots {
  display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px;
}
header { justify-content:space-between; margin-bottom:12px }
.small { font-size:16px; padding:7px 12px }
select { padding:8px; border:2px solid #66958d; border-radius:12px; background:#fffbee }
.seascape {
  position:fixed; inset:0; overflow:hidden; z-index:-1; pointer-events:none;
  background:
    radial-gradient(circle at 81% 13%,#fff5b4 0 4vmin,#fff1ad70 4.2vmin,transparent 11vmin),
    linear-gradient(#9bdeeb,#e0f6ee 53%,#71cccc 53.1%,#219aa5 77%,#f0d39d 77.2%,#fff2cd);
}
.cloud { position:absolute; left:7%; top:8%; font-size:clamp(40px,7vw,85px); opacity:.8; animation:drift 18s ease-in-out infinite alternate }
@keyframes drift { to { transform:translateX(13vw) } }
.wave { position:absolute; left:-25%; width:150%; height:12%; animation:swell 8s ease-in-out infinite alternate }
.wave.one { top:58%; color:#91e4df }
.wave.two { top:67%; color:#c8f2e7; animation: swell 6s ease-in-out infinite alternate-reverse }
@keyframes swell { to { transform:translate(8%,6px) } }
#beachCrab {
  position:fixed; z-index:2; bottom:4px; left:1%; min-width:54px;
  background:none; border:0; box-shadow:none; padding:0;
  font-size:36px; filter:drop-shadow(0 3px 2px #62432155);
  animation:scuttle 23s ease-in-out infinite alternate;
}
@keyframes scuttle { 0%,8%{left:1%} 43%{left:39%} 49%{left:39%} 92%,100%{left:calc(99% - 55px)} }
#beachCrab span { display:block }
#beachCrab.dance span { animation:dance .48s ease-in-out 2 }
@keyframes dance { 30%{transform:translateY(-13px) rotate(12deg)} 65%{transform:rotate(-12deg)} }
.hero { display:block; font-size:clamp(50px,9vmin,83px); line-height:1.15; margin:auto; filter:drop-shadow(0 5px 2px #416e7133) }
.menu { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:14px; margin:18px auto }
.menu button { min-height:100px; font-size:clamp(15px,2vw,18px); padding:9px 5px }
.icon { display:block; font-size:clamp(32px,5.5vmin,48px); filter:drop-shadow(0 3px 1px #604d3133) }
.panel {
  background:linear-gradient(145deg,#fffdf4f7,#fff5e3f2); border:2px solid #fff9;
  box-shadow:inset 0 3px #fff,0 8px 0 #c6b39275,0 15px 25px #29565b24;
  border-radius:27px; padding:clamp(12px,2.4vw,25px); margin:12px auto;
}
.stage { display:grid; gap:clamp(8px,2vh,17px); justify-items:center }
.sample { font-size:clamp(48px,11vmin,88px); line-height:1.16 }
.card { min-width:clamp(62px,13vw,120px); font-size:clamp(34px,7vmin,60px); padding:5px 12px }
.tile { min-width:48px; font-size:clamp(24px,4.5vmin,38px); padding:5px 11px }
.slot { min-width:28px; font-size:clamp(21px,4.3vw,36px); border-bottom:4px solid #aeb8a6; color:#72857c }
.slot.next { background:#ffe9ac; border-color:#b16626 }
.slot.filled { background:#d9f3c9; border-color:#4c9966; color:#285a43 }
.used { visibility:hidden }
.ok,.found,.lit { background:linear-gradient(#fbffcd,#aae6b2); border-color:#43825a }
.lit { outline:5px solid #e5991e; transform:translateY(-4px) }
#status { min-height:1.4em; color:#295e54 }
.hint { animation:wiggle .32s ease-in-out }
@keyframes wiggle { 30%{transform:rotate(-4deg)} 70%{transform:rotate(4deg)} }
.pair { display:flex; width:100%; justify-content:center; gap:10px }
.picture,.board { display:grid; grid-template-columns:repeat(2,1fr); overflow:hidden; border:3px solid #698b7e; border-radius:15px }
.picture { width:min(44%,210px) }
.spot { min-width:0; aspect-ratio:1.3; border:1px solid #d5dfc9; border-radius:0; box-shadow:none; padding:0; font-size:clamp(28px,6vmin,50px) }
.board { width:min(52vw,30vh,220px); aspect-ratio:1 }
.cell { min-width:0; min-height:0; background:white; border:1px dashed #9aa799 }
.cell svg { opacity:.22 }
.cell.active { outline:4px dashed #b9651d; outline-offset:-5px }
.cell.placed svg { opacity:1 }
.piece { width:clamp(52px,15vw,88px); aspect-ratio:1; padding:0; overflow:hidden }
.cell svg,.piece svg { width:100%; height:100%; display:block }
.pond { display:flex; width:min(100%,520px); justify-content:center; gap:5px; background:#a3dfe2; padding:25px 6px 12px; border-radius:25px }
.pad { position:relative; flex:1; max-width:76px; padding:3px; border-radius:50%; background:linear-gradient(#d5ef91,#85c67b) }
.frog { position:absolute; left:50%; top:-25px; transform:translateX(-50%); font-size:30px }
.map,.movie { width:min(100%,680px); border-radius:20px; overflow:hidden; border:3px solid #578c89; background:#b9e8e4 }
.map { display:block; touch-action:none; user-select:none; -webkit-user-select:none; cursor:crosshair }
.movie { position:relative; aspect-ratio:2.2; min-height:145px; background:linear-gradient(#a7dfec,#ecf9e9 55%,#86d5ce 56%,#3a99aa) }
.movie .land { position:absolute; bottom:15%; right:7%; font-size:clamp(47px,9vw,95px); filter:drop-shadow(0 6px 2px #365b5c55) }
.movie .actor { position:absolute; bottom:12%; left:5%; font-size:clamp(37px,7vw,72px); }
.movie.play .actor { animation:voyage 2.8s ease-in-out forwards }
@keyframes voyage { 0%{left:5%;transform:rotate(-7deg)} 40%{transform:translateY(-8px) rotate(4deg)} 100%{left:55%;transform:rotate(-3deg)} }
.movie .sky { position:absolute; top:5%; left:9%; font-size:clamp(27px,6vw,48px) }
.storybtn { min-width:110px }
.storybtn span { display:block; font-size:36px }
.swatch { min-width:49px; font-size:22px }
[aria-pressed="true"].swatch { outline:3px solid #396b70; outline-offset:2px }
.spark { position:fixed; z-index:4; pointer-events:none; left:50%; top:43%; animation:burst .7s ease-out forwards; font-size:24px }
@keyframes burst { to { transform:translate(var(--x),var(--y)); opacity:0 } }
@media(max-width:720px){.menu{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:480px){.menu{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.slots{gap:4px}.tools{gap:5px}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after { animation:none!important; transition:none!important }
  .movie.play .actor { left:55% }
  .spark { display:none }
}
</style>
</head>
<body>
<div class="seascape" aria-hidden="true">
  <span class="cloud">☁️</span>
  <svg class="wave one" viewBox="0 0 800 70" preserveAspectRatio="none">
    <path d="M0 25Q50 0 100 25T200 25T300 25T400 25T500 25T600 25T700 25T800 25V70H0Z" fill="currentColor"/>
  </svg>
  <svg class="wave two" viewBox="0 0 800 70" preserveAspectRatio="none">
    <path d="M0 23Q50 47 100 23T200 23T300 23T400 23T500 23T600 23T700 23T800 23V70H0Z" fill="currentColor"/>
  </svg>
</div>
<button id="beachCrab" aria-label="Tervita rannakrabi"><span>🦀</span></button>
<main id="app"></main>
<script>
'use strict';

// 50 sõna. Igal sõnal on oma pilt.
const words = [
  ['KALA','🐟'],['KRABI','🦀'],['HÜLJES','🦭'],['VAAL','🐋'],['HAI','🦈'],
  ['DELFIIN','🐬'],['KARP','🐚'],['PAAT','⛵'],['LAEV','🚢'],['KAHEKSAJALG','🐙'],
  ['KASS','🐱'],['KOER','🐶'],['KARU','🐻'],['REBANE','🦊'],['JÄNES','🐰'],
  ['SIIL','🦔'],['ORAV','🐿️'],['KONN','🐸'],['TIGU','🐌'],['ÖÖKULL','🦉'],
  ['SIGA','🐷'],['LEHM','🐮'],['LAMMAS','🐑'],['HOBUNE','🐴'],['KANA','🐔'],
  ['TIBU','🐥'],['PART','🦆'],['KITS','🐐'],['KUKK','🐓'],['MESILANE','🐝'],
  ['ÕUN','🍎'],['PIRN','🍐'],['BANAAN','🍌'],['SIDRUN','🍋'],['KIRSS','🍒'],
  ['MAASIKAS','🍓'],['PORGAND','🥕'],['KURK','🥒'],['MUNA','🥚'],['LEIB','🍞'],
  ['PÄIKE','☀️'],['KUU','🌙'],['TÄHT','⭐'],['PILV','☁️'],['PUU','🌳'],
  ['LILL','🌷'],['SEEN','🍄'],['AUTO','🚗'],['BUSS','🚌'],['RONG','🚂']
].map(([word,icon])=>({word,icon}));

const games = {
  match:['🦭','Leia sama pilt',matchGame],
  letters:['🔠','Leia sama täht',letterGame],
  spell:['🧱','Lao sõna',spellGame],
  puzzle:['🧩','Pane pusle kokku',puzzleGame],
  diff:['🔎','Leia erinevused',diffGame],
  frog:['🐸','Konna hüpped',frogGame],
  memory:['✨','Jäta meelde',memoryGame],
  initial:['🎒','Leia algustäht',initialGame],
  map:['🗺️','Joonista aardekaart',mapGame],
  movie:['🎬','Hülge merefilm',movieGame]
};

const get = id=>document.getElementById(id);
const app = get('app');
const alphabet = [...new Set(words.flatMap(x=>[...x.word]))];
const bags = new Map(), timers = new Set();
let game,deck,round,rounds=16,locked=false,voiceText='',sound=true,audio;
let stars=0;
try { stars=Number(localStorage.getItem('rannasober-stars'))||0 } catch {}

function mix(items){
  const a=[...items];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function pick(items){return items[Math.floor(Math.random()*items.length)]}
function nextItems(key,pool,count){
  let bag=bags.get(key)||[];
  const result=[];
  while(result.length<count){
    if(!bag.length){
      bag=[...mix(pool.filter(x=>result.includes(x))),...mix(pool.filter(x=>!result.includes(x)))];
    }
    result.push(bag.pop());
  }
  bags.set(key,bag);
  return result;
}
function later(fn,ms){
  const id=setTimeout(()=>{timers.delete(id);fn()},ms);
  timers.add(id);
}
function cancel(){
  timers.forEach(clearTimeout);timers.clear();
  if('speechSynthesis' in window) speechSynthesis.cancel();
}
function unlock(){
  if(!sound)return;
  try{
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C)return;
    if(!audio)audio=new C();
    if(audio.state==='suspended')audio.resume().catch(()=>{});
  }catch{}
}
function tone(hz=480,delay=0){
  if(!sound||!audio||audio.state!=='running')return;
  const t=audio.currentTime+delay;
  const o=audio.createOscillator(),g=audio.createGain();
  o.frequency.value=hz;o.type='sine';
  g.gain.setValueAtTime(.001,t);
  g.gain.exponentialRampToValueAtTime(.07,t+.02);
  g.gain.exponentialRampToValueAtTime(.001,t+.18);
  o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.2);
  o.onended=()=>{o.disconnect();g.disconnect()};
}
function speak(text){
  if(!text||!sound||!('speechSynthesis' in window))return false;
  const v=speechSynthesis.getVoices().find(v=>/^et(?:[-_]|$)/i.test(v.lang));
  if(!v)return false;
  speechSynthesis.cancel();
  const line=new SpeechSynthesisUtterance(text);
  line.voice=v;line.lang='et-EE';line.rate=.84;
  speechSynthesis.speak(line);return true;
}
if('speechSynthesis' in window)speechSynthesis.getVoices();
function tell(text){voiceText=text;speak(text)}
function status(text){if(get('status'))get('status').textContent=text}
function btn(parent,label,html,action,css=''){
  const b=document.createElement('button');
  b.type='button';b.className=css;b.setAttribute('aria-label',label);
  b.innerHTML=html;b.onclick=()=>{unlock();action(b)};
  parent.append(b);return b;
}
function retry(b,text='Proovi veel.'){
  b.classList.remove('hint');void b.offsetWidth;b.classList.add('hint');
  tone(300);status(text);
}
function celebrate(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  for(let i=0;i<7;i++){
    const s=document.createElement('span');s.className='spark';
    s.textContent=i%2?'✦':'⭐';s.setAttribute('aria-hidden','true');
    const angle=Math.PI*2*i/7;
    s.style.setProperty('--x',Math.cos(angle)*95+'px');
    s.style.setProperty('--y',Math.sin(angle)*70-30+'px');
    document.body.append(s);setTimeout(()=>s.remove(),760);
  }
}
function controls(parent,replay){
  const b=btn(parent,'Lülita heli sisse või välja','',()=>{
    sound=!sound;paint();
    if(sound){unlock();tone();speak(voiceText)}
    else if('speechSynthesis' in window)speechSynthesis.cancel();
  },'small');
  function paint(){b.textContent=sound?'🔊':'🔇';b.setAttribute('aria-pressed',String(sound))}
  paint();
  if(replay)btn(parent,'Kuula juhist uuesti','👂 Kuula',()=>{
    if(!sound){status('Heli saad sisse lülitada kõlarinupust.');return}
    if(!speak(voiceText)){tone();status('Jälgi pilte. Eesti kõnehääl pole seadmes saadaval.')}
  },'small');
}
get('beachCrab').onclick=()=>{
  unlock();const crab=get('beachCrab');
  crab.classList.remove('dance');void crab.offsetWidth;crab.classList.add('dance');
  tone(620);tone(760,.12);
};

function home(){
  cancel();locked=false;voiceText='';
  app.innerHTML='<header><span>⭐ '+stars+'</span><div class="tools" id="tools"></div></header>'+
    '<div class="hero">🏝️</div><h1>Rannasõbra aardesaar</h1>'+
    '<div class="row"><label for="length">Voorude arv</label>'+
    '<select id="length"><option>8</option><option>16</option><option>24</option></select></div>'+
    '<div class="menu" id="menu"></div>';
  controls(get('tools'),false);
  get('length').value=rounds;
  get('length').onchange=e=>{rounds=Number(e.target.value)};
  for(const [key,[icon,name]] of Object.entries(games)){
    btn(get('menu'),name,'<span class="icon">'+icon+'</span>'+name,()=>{tone();start(key)});
  }
}
function start(key){
  cancel();game=key;round=0;
  deck=nextItems(key,words,rounds);
  // Sõnamäng algab võimaluse korral lühikese sõnaga.
  if(key==='spell'){
    const i=deck.findIndex(x=>x.word.length<=4);
    if(i>0)[deck[0],deck[i]]=[deck[i],deck[0]];
  }
  show();
}
function show(){
  cancel();locked=false;
  app.innerHTML='<header><div id="nav"></div><span>🐚 '+(round+1)+' / '+rounds+
    '</span><div class="tools" id="tools"></div></header><h2>'+games[game][1]+
    '</h2><section class="panel"><div class="stage" id="stage"></div>'+
    '<p role="status" id="status"></p></section>';
  btn(get('nav'),'Tagasi mänguvalikusse','⌂ Avaleht',home,'small');
  controls(get('tools'),true);
  games[game][2](deck[round]);
}
function win(b){
  if(locked)return;
  locked=true;if(b)b.classList.add('ok');
  stars++;try{localStorage.setItem('rannasober-stars',String(stars))}catch{}
  celebrate();tone(523);tone(659,.12);tone(784,.24);
  status('⭐ Tubli! Üks täht juures.');
  later(()=>{round++;round<rounds?show():treasure()},1100);
}
function treasure(){
  cancel();
  app.innerHTML='<section class="panel stage"><h1>Sinu aardelaegas</h1>'+
    '<div id="gift"></div><p id="reward">Puuduta laegast!</p><div class="row" id="again"></div></section>';
  btn(get('gift'),'Ava aardelaegas','🎁',b=>{
    b.textContent=pick(['💎','👑','💍','🏆']);b.disabled=true;celebrate();tone(760);
    get('reward').textContent='Leidsid aarde! Sul on kokku '+stars+' tähte.';
    tell('Leidsid aarde!');
  },'sample');
  btn(get('again'),'Mängi edasi','▶ Mängi edasi',()=>start(game));
  btn(get('again'),'Vali mäng','⌂ Vali mäng',home);
}
function rows(sample){
  get('stage').innerHTML='<div class="sample" id="sample">'+sample+'</div><div class="row" id="options"></div>';
}
function choose(correct,pool,render,label,instruction){
  const n=round<2?2:round<5?3:4;
  const wrong=mix(pool.filter(x=>x!==correct)).slice(0,n-1);
  for(const x of mix([correct,...wrong])){
    btn(get('options'),label(x),render(x),b=>{
      if(locked)return;
      if(x===correct)win(b);else retry(b,'Vaata näidist ja proovi uuesti.');
    },'card');
  }
  tell(instruction);
}
function matchGame(x){
  rows(x.icon);choose(x,words,i=>i.icon,i=>i.word,'Leia sama pilt. '+x.word.toLowerCase()+'.');
}
function letterGame(x){
  const c=pick([...x.word]);rows(c);
  choose(c,alphabet,i=>i,i=>'Täht '+i,'Leia sama täht. '+c+'.');
}
function initialGame(x){
  rows(x.icon+'<div style="font-size:25px"><strong style="color:#a34818">'+
    x.word[0]+'</strong>'+x.word.slice(1)+'</div>');
  choose(x.word[0],alphabet,i=>i,i=>'Täht '+i,x.word.toLowerCase()+'. Leia esimene täht.');
}
function spellGame(x){
  let cursor=0;const letters=[...x.word];
  get('stage').innerHTML='<div class="sample">'+x.icon+'</div>'+
    '<div class="slots" id="slots"></div><div class="row" id="tiles"></div>';
  for(const c of letters){
    const s=document.createElement('span');s.className='slot';s.textContent=c;get('slots').append(s);
  }
  const slots=get('slots').children;slots[0].classList.add('next');
  for(const c of mix(letters)){
    btn(get('tiles'),'Täht '+c,c,b=>{
      if(locked)return;
      if(c!==letters[cursor]){retry(b,'Otsi tähte '+letters[cursor]+'.');return}
      b.disabled=true;b.classList.add('used');slots[cursor].className='slot filled';tone(440+cursor*40);
      if(++cursor===letters.length){speak(x.word.toLowerCase());win();return}
      slots[cursor].classList.add('next');voiceText='Leia täht '+letters[cursor]+'.';status(voiceText);
    },'tile');
  }
  tell('Lao sõna '+x.word.toLowerCase()+'. Leia täht '+letters[0]+'.');
}
function crop(x,i){
  const boxes=['0 0 50 50','50 0 50 50','0 50 50 50','50 50 50 50'];
  return '<svg aria-hidden="true" viewBox="'+boxes[i]+'"><rect width="100" height="100" fill="#c6eae9"/>'+
    '<circle cx="18" cy="16" r="10" fill="#ffcf67"/><path d="M0 66Q32 48 56 66T100 62V100H0Z" fill="#91cdaa"/>'+
    '<path d="M0 88Q40 67 100 88V100H0Z" fill="#f3d09a"/>'+
    '<text x="50" y="73" text-anchor="middle" font-size="68">'+x.icon+'</text></svg>';
}
function puzzleGame(x){
  let step=0;
  const order=round<2?[0,1,2,3]:mix([0,1,2,3]);
  const labels=['ülemine vasak','ülemine parem','alumine vasak','alumine parem'];
  get('stage').innerHTML='<div id="board" class="board"></div><div class="row" id="pieces"></div>';
  for(let i=0;i<4;i++)get('board').insertAdjacentHTML('beforeend','<div class="cell">'+crop(x,i)+'</div>');
  const cells=get('board').children;cells[order[0]].classList.add('active');
  for(const i of mix([0,1,2,3])){
    btn(get('pieces'),labels[i]+' tükk',crop(x,i),b=>{
      if(locked)return;
      if(i!==order[step]){retry(b,'Vaata punktiiriga ruutu.');return}
      cells[i].className='cell placed';b.classList.add('used');b.disabled=true;tone(460+step*55);
      if(++step===4){win();return}
      cells[order[step]].classList.add('active');
    },'piece');
  }
  tell('Leia märgitud kohta sobiv tükk.');
}
function diffGame(x){
  const pool=mix(words.filter(a=>a!==x));
  const left=mix([x,...pool.slice(0,3)]),right=[...left];
  const changed=mix([0,1,2,3]).slice(0,round<3?1:2),found=new Set();
  changed.forEach((v,i)=>right[v]=pool[i+3]);
  const task=changed.length===1?'Leia üks erinevus.':'Leia kaks erinevust.';
  get('stage').innerHTML='<p>'+task+'</p><div class="pair"><div class="picture" id="left"></div>'+
    '<div class="picture" id="right"></div></div>';
  for(const [side,list] of [['left',left],['right',right]]){
    list.forEach((v,i)=>btn(get(side),v.word,v.icon,b=>{
      if(locked||found.has(i))return;
      if(!changed.includes(i)){retry(b,'Need pildid on ühesugused.');return}
      found.add(i);for(const s of ['left','right'])get(s).children[i].classList.add('found');
      if(found.size===changed.length)win();else{tone(620);status('Üks erinevus veel!')}
    },'spot'));
  }
  tell(task);
}
function frogGame(){
  const n=1+Math.floor(Math.random()*(round<2?3:6));let jumped=0;
  get('stage').innerHTML='<div class="sample">🐸</div><p>Tee '+n+(n===1?' hüpe.':' hüpet.')+
    '</p><div>'+('💧'.repeat(n))+'</div><div class="pond" id="pond"></div>';
  for(let i=1;i<=n;i++){
    btn(get('pond'),'Vesiroosileht '+i,String(i),b=>{
      if(locked)return;
      if(i!==jumped+1){retry(b,'Leia leht numbriga '+(jumped+1)+'.');return}
      get('pond').querySelector('.frog')?.remove();
      b.insertAdjacentHTML('beforeend','<span class="frog">🐸</span>');tone(350+i*65);speak(String(i));
      if(++jumped===n)win(b);
    },'pad');
  }
  tell('Aita konnal hüpata. Alusta esimesest lehest.');
}
function memoryGame(x){
  const list=mix([x,...mix(words.filter(a=>a!==x)).slice(0,2)]);
  const length=round<3?2:round<8?3:4;
  const seq=[];for(let i=0;i<length;i++)seq.push(pick([0,1,2].filter(j=>j!==seq[i-1])));
  let step=0,playing=false;
  get('stage').innerHTML='<p id="memHint"></p><div class="row" id="cards"></div><div id="repeat"></div>';
  const cards=list.map((v,i)=>btn(get('cards'),v.word,v.icon,b=>{
    if(locked||playing)return;
    if(i!==seq[step]){retry(b);replay();return}
    tone([440,554,659][i]);b.classList.add('ok');later(()=>b.classList.remove('ok'),220);
    if(++step===length)win(b);else status('Õige! Veel '+(length-step)+'.');
  },'card'));
  function replay(){
    if(locked||playing)return;
    step=0;playing=true;status('');get('memHint').textContent='👀 Vaata järjekorda';
    cards.forEach(b=>b.disabled=true);
    seq.forEach((v,i)=>{
      later(()=>{cards[v].classList.add('lit');tone([440,554,659][v])},450+i*850);
      later(()=>cards[v].classList.remove('lit'),1030+i*850);
    });
    later(()=>{
      playing=false;cards.forEach(b=>b.disabled=false);
      get('memHint').textContent='☝️ Puuduta samas järjekorras';tell('Nüüd on sinu kord.');
    },450+seq.length*850);
  }
  btn(get('repeat'),'Näita uuesti','↻ Näita uuesti',replay,'small');
  tell('Vaata, millised pildid süttivad.');replay();
}

// SVG-kaart. Pointer Events toetab hiirt, sõrme ja tahvlipliiatsit.
function mapGame(){
  const flip=Math.random()<.5;
  const spots=[[68,165],[182,81],[305,149],[438,65],[540,142]]
    .map(([x,y])=>({x:flip?600-x:x,y:y+Math.floor(Math.random()*31)-15}));
  const stops=round<3?[spots[0],spots[2],spots[4]]:spots;
  const ns='http://www.w3.org/2000/svg';
  let index=0,active=null,line=null,color='#9a442c',free=false;
  get('stage').innerHTML=
    '<p id="mapHint"></p><svg class="map" id="mapPaper" viewBox="0 0 600 240" aria-label="Joonistatav aardekaart">'+
    '<rect width="600" height="240" fill="#99dce0"/>'+
    '<path d="M8 135Q33 40 158 51T369 41Q489 2 577 71Q628 151 532 186T306 203Q183 228 79 209Q12 205 8 135Z" fill="#69a99b"/>'+
    '<path d="M8 125Q33 30 158 41T369 31Q489 -8 577 61Q628 141 532 176T306 193Q183 218 79 199Q12 195 8 125Z" fill="#f2dfa4"/>'+
    '<text x="26" y="40" font-size="26">🧭</text><text x="275" y="72" font-size="35">🌴</text>'+
    '<text x="374" y="195" font-size="26">🪨</text><text x="110" y="222" font-size="25">🐟</text>'+
    '<g id="guide"></g><g id="ink"></g><g id="marks" pointer-events="none"></g></svg>'+
    '<div class="row" id="paintTools"></div>';
  const paper=get('mapPaper');
  function svg(tag,attrs){
    const n=document.createElementNS(ns,tag);
    for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);
    return n;
  }
  function mark(){
    get('marks').replaceChildren();get('guide').replaceChildren();
    if(free){get('mapHint').textContent='🎨 Joonista oma saar või meretee.';return}
    get('mapHint').textContent=index===0?'Alusta lipust ja tõmba joon mööda täppe.':'Jätka helendava märgini.';
    const guide=svg('polyline',{points:stops.map(p=>p.x+','+p.y).join(' '),
      fill:'none',stroke:'#9a8358','stroke-width':3,'stroke-dasharray':'4 9'});
    get('guide').append(guide);
    stops.forEach((p,i)=>{
      get('marks').append(svg('circle',{cx:p.x,cy:p.y,r:i===index?20:14,
        fill:i<index?'#b8e3ab':'#fff9de',stroke:i===index?'#b85d19':'#65897b','stroke-width':i===index?5:2}));
      const t=svg('text',{x:p.x,y:p.y+7,'text-anchor':'middle','font-size':19});
      t.textContent=i===0?'⚑':i===stops.length-1?'💎':i<index?'✓':'•';get('marks').append(t);
    });
  }
  function coords(e){
    const p=paper.createSVGPoint();p.x=e.clientX;p.y=e.clientY;
    return p.matrixTransform(paper.getScreenCTM().inverse());
  }
  function distance(p,q){return Math.hypot(p.x-q.x,p.y-q.y)}
  function reset(){
    if(active!==null&&paper.hasPointerCapture(active))paper.releasePointerCapture(active);
    active=null;line=null;index=0;get('ink').replaceChildren();mark();status('');
  }
  function stroke(p){
    line=svg('polyline',{points:p.x+','+p.y,fill:'none',stroke:color,
      'stroke-width':free?5:6,'stroke-linecap':'round','stroke-linejoin':'round'});
    get('ink').append(line);
  }
  paper.onpointerdown=e=>{
    if(locked||active!==null||e.button!==0)return;
    const p=coords(e);
    if(!free&&distance(p,stops[Math.max(0,index-1)])>32){
      status(index?'Jätka viimasest läbitud märgist.':'Pane sõrm lipule.');return;
    }
    unlock();e.preventDefault();active=e.pointerId;paper.setPointerCapture(active);
    stroke(p);
    if(!free&&index===0){index=1;mark();tone(410)}
  };
  paper.onpointermove=e=>{
    if(e.pointerId!==active||locked||!line)return;
    const p=coords(e);
    line.setAttribute('points',line.getAttribute('points')+' '+p.x.toFixed(1)+','+p.y.toFixed(1));
    if(!free&&index<stops.length&&distance(p,stops[index])<26){
      index++;tone(400+index*65);mark();
      if(index===stops.length)win();
    }
  };
  function end(e){
    if(e.pointerId!==active)return;
    active=null;line=null;
  }
  paper.onpointerup=end;paper.onpointercancel=end;paper.onlostpointercapture=end;
  for(const [name,icon,value] of [['Pruun','🟤','#9a442c'],['Sinine','🔵','#225baf'],['Roheline','🟢','#27794b']]){
    const b=btn(get('paintTools'),name,icon,()=>{
      color=value;get('paintTools').querySelectorAll('.swatch').forEach(n=>n.setAttribute('aria-pressed',String(n===b)));
    },'swatch');
    b.setAttribute('aria-pressed',String(value===color));
  }
  btn(get('paintTools'),'Kustuta jooned','↻ Puhasta',()=>{if(!locked)reset()},'small');
  btn(get('paintTools'),'Vaheta joonistamisviisi','🎨 Vaba joonistus',b=>{
    if(locked)return;
    free=!free;b.textContent=free?'🗺️ Aardetee':'🎨 Vaba joonistus';reset();
    tell(free?'Joonista sõrmega oma pilt.':'Alusta lipust ja leia aare.');
  },'small');
  mark();tell('Alusta lipust. Tõmba sõrmega joon mööda täppe aardeni.');
}

// Valikutega animafilm. Iga haru määrab järgmise stseeni ja tegevused.
const destinations=[
  {name:'Tuletorn',icon:'🗼',line:'Kaldal süttib tuletorni tuli.',
    choices:[['🔦','Näita valgust','Hüljes näitab laternaga teed. Kalapaat leiab sadama!','⛵'],
             ['🔔','Helista kella','Kell heliseb. Majakavaht lehvitab hülgele!','👋']]},
  {name:'Palmisaar',icon:'🏝️',line:'Saare liival paistab midagi ümmargust.',
    choices:[['🐢','Aita kilpkonna','Hüljes saadab väikese kilpkonna lainetesse.','🐢'],
             ['🥥','Veereta kookost','Kookos veereb vette. Krabi saab endale pisikese parve!','🦀']]},
  {name:'Koopasuu',icon:'⛰️',line:'Koopast kostab vaikne kõlin.',
    choices:[['🎵','Laula vastu','Koobas vastab kajaga ja nahkhiir ärkab.','🦇'],
             ['💎','Otsi läiget','Hüljes leiab veest sinise kristalli!','💎']]},
  {name:'Linnulaid',icon:'🪺',line:'Pesast kostab piiksumist.',
    choices:[['🪶','Vii sulg','Pehme sulg teeb linnupesa soojaks.','🐣'],
             ['🐟','Too kala','Emalind viib kala oma pojale.','🐦']]},
  {name:'Jäälaht',icon:'🧊',line:'Valge jääpanga kõrval sulpsatab vesi.',
    choices:[['🐋','Tervita vaala','Vaal vastab kõrge veesambaga!','🐋'],
             ['❄️','Püüa lumehelves','Helves maandub hülge ninal. Hüljes aevastab!','❄️']]}
];
function movieGame(){
  let phase=0;
  const routes=nextItems('filmipaigad',destinations,2);
  const sky=pick(['☀️','🌤️','🌙']);
  get('stage').innerHTML='<div class="movie" id="screen"><span class="sky">'+sky+'</span>'+
    '<span class="land" id="land"></span><span class="actor" id="actor">🦭</span></div>'+
    '<p id="caption" aria-live="polite"></p><div class="row" id="filmChoices"></div>';
  function scene(icon,text,next){
    const screen=get('screen');
    get('filmChoices').replaceChildren();
    get('land').textContent=icon;get('caption').textContent=text;tell(text);
    screen.classList.remove('play');void screen.offsetWidth;screen.classList.add('play');
    let ready=false;
    function arrive(){
      if(ready||locked)return;
      ready=true;get('filmChoices').replaceChildren();next();
    }
    btn(get('filmChoices'),'Liigu valikuni','⏩ Edasi',arrive,'small');
    later(arrive,3000);
  }
  function choice(icon,name,fn){
    btn(get('filmChoices'),name,'<span>'+icon+'</span>'+name,fn,'storybtn');
  }
  function branch(dest){
    if(phase!==1)return;phase=2;tone(550);
    scene(dest.icon,dest.line,()=>{
      phase=3;
      for(const [icon,name,ending,endIcon] of mix(dest.choices)){
        choice(icon,name,()=>{
          if(phase!==3)return;phase=4;tone(620);
          scene(endIcon,ending,()=>{
            phase=5;
            choice('⭐','Lõpeta lugu',b=>{if(phase===5){phase=6;win(b)}});
          });
        });
      }
    });
  }
  scene('🌊','Hüljes asub mereretkele. Kuhu ta täna ujub?',()=>{
    phase=1;
    for(const dest of routes)choice(dest.icon,dest.name,()=>branch(dest));
  });
}
home();

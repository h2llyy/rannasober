<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#aee7e3">
<title>Rannasõbra mängusaar</title>
<style>
:root {
  --ink: #193e48;
  --teal: #237b79;
  --cream: #fffaf0;
  --edge: #c9ab7d;
}
* { box-sizing: border-box }
body {
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0;
  color: var(--ink);
  font: 650 17px/1.35 system-ui, sans-serif;
  background:
    radial-gradient(circle at 85% 12%, #fff8cc 0 3.5vmin, transparent 3.7vmin),
    linear-gradient(170deg, transparent 0 60%, #ffffff50 60.2% 60.8%, transparent 61%),
    linear-gradient(#bcebea 0%, #def7ed 54%, #92d8d1 54.2%, #bfe9df 69%, #f5dfb5 69.3%, #fff0cf);
}
main { width: min(94%, 880px); margin: auto; padding: 14px 0 28px; text-align: center }
h1, h2, p { margin: 0 }
h1, h2 { font-family: Georgia, serif; line-height: 1.1; text-wrap: balance }
h1 { font-size: clamp(36px, 6vw, 64px) }
h2 { font-size: clamp(25px, 4vw, 40px) }
button {
  font: inherit; color: inherit; cursor: pointer; touch-action: manipulation;
  min-height: 48px; border: 2px solid #47716d; border-radius: 20px;
  padding: .55em .85em;
  background: linear-gradient(155deg, #fffef9, #fff4d8);
  box-shadow: inset 0 3px 0 #ffffffda, 0 5px 0 var(--edge), 0 8px 14px #214a511a;
  transition: transform .12s, box-shadow .12s, background .15s;
}
button:active:not(:disabled) {
  transform: translateY(4px) scale(.97);
  box-shadow: inset 0 2px 3px #8e73452c, 0 1px 0 var(--edge);
}
button:focus-visible { outline: 4px solid #905013; outline-offset: 3px }
button:disabled { cursor: default }
header, .row, .slots, .tools, .trail {
  display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 10px;
}
header { justify-content: space-between; margin-bottom: 15px }
.tools { gap: 7px }
.small { font-size: 16px; padding: 8px 13px }
.hero { margin: 12px auto 18px }
.mascot { font-size: clamp(56px, 10vmin, 92px); display: inline-block; line-height: 1.25 }
.menu {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 15px; margin: 20px auto;
}
.menu button { min-height: 115px; padding: 10px 5px }
.icon { display: block; font-size: clamp(33px, 6vmin, 54px); line-height: 1.2; margin-bottom: 5px }
.emoji, .icon, .mascot { filter: drop-shadow(0 3px 1px #674f3e30) }
.sheet {
  border-radius: 28px; border: 2px solid #ffffffcf; margin: 12px auto;
  padding: clamp(12px, 2.5vw, 24px);
  background: #fffaf0e8; box-shadow: 0 9px 22px #34666c21;
}
.stage { display: grid; justify-items: center; gap: clamp(10px, 2vh, 18px) }
.sample { min-width: 100px; font-size: clamp(50px, 11vmin, 90px); line-height: 1.15 }
.card { min-width: clamp(62px, 14vw, 118px); font-size: clamp(34px, 7vmin, 64px); padding: 6px 12px }
.tile { min-width: 52px; font-size: clamp(25px, 5vmin, 39px); padding: 5px 12px }
.slot {
  display: grid; place-items: center; min-width: 32px; height: 45px;
  border-bottom: 4px solid #afbaa8; font-size: clamp(22px, 4vw, 33px); color: #788980;
}
.slot.next { background: #fff0b7; border-color: #b66a24; border-radius: 8px 8px 0 0 }
.slot.filled { color: #236449; border-color: #55a47a }
.used { visibility: hidden }
.ok, .found, .lit { background: linear-gradient(#f6ffcf, #a4e7ac); border-color: #39895b }
.lit { outline: 5px solid #ffbc37; transform: translateY(-4px) scale(1.05) }
.hint { animation: nudge .38s ease-in-out }
@keyframes nudge { 30% { transform: rotate(-4deg) } 70% { transform: rotate(4deg) } }
#status { min-height: 1.5em; margin-top: 12px; color: #275b54 }
.progress { font-size: 17px; white-space: nowrap }
.pair { display: flex; gap: clamp(5px, 2vw, 16px); justify-content: center; width: 100% }
.picture, .board { display: grid; grid-template-columns: repeat(2, 1fr); overflow: hidden }
.picture { width: min(44%, 220px); border: 3px solid #6f9289; border-radius: 16px; background: #edf6df }
.spot {
  min-width: 0; min-height: 48px; aspect-ratio: 1.25; border: 1px solid #d5dfc9;
  border-radius: 0; box-shadow: none; padding: 0; font-size: clamp(24px, 6.5vmin, 50px);
}
.board { width: min(52vw, 29vh, 225px); aspect-ratio: 1; border: 3px solid #4e776d; border-radius: 15px }
.cell { min-width: 0; min-height: 0; border: 1px dashed #88a19a; overflow: hidden; background: white }
.cell svg { opacity: .22 }
.cell.placed svg { opacity: 1 }
.cell.active { outline: 4px dashed #ab652c; outline-offset: -5px }
.piece { width: clamp(50px, 15vw, 90px); aspect-ratio: 1; padding: 0; overflow: hidden }
.piece svg, .cell svg { display: block; width: 100%; height: 100% }
.pond {
  display: flex; gap: 6px; justify-content: center; align-items: end;
  width: min(100%, 520px); padding: 18px 8px 10px; border-radius: 23px;
  background: linear-gradient(#d2f3f5, #9bdbde);
}
.pad {
  position: relative; flex: 1; max-width: 80px; height: 52px; padding: 3px;
  border-radius: 52% 47% 44% 48%; border-color: #45754b;
  background: linear-gradient(#d3ec8f, #8cca76); --edge: #759e68;
}
.pad .frog { position: absolute; top: -25px; left: 50%; transform: translateX(-50%); font-size: 30px }
.count { font-size: clamp(32px, 7vmin, 58px); letter-spacing: 3px }
.spark {
  position: fixed; pointer-events: none; z-index: 4; left: 50%; top: 45%;
  animation: sparkle .75s ease-out forwards; font-size: 25px;
}
@keyframes sparkle {
  from { transform: translate(-50%, 0) scale(.5); opacity: 1 }
  to { transform: translate(var(--dx), var(--dy)) scale(1.1); opacity: 0 }
}
@media (max-width: 630px) {
  .menu { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px }
  .menu button { min-height: 82px }
  .slots { gap: 4px }
}
@media (max-height: 520px) {
  main { padding-top: 6px }
  .hero { margin: 4px auto }
  .menu button { min-height: 66px }
  .mascot { font-size: 40px }
  .stage { gap: 6px }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important }
  .spark { display: none }
}
</style>
</head>
<body>
<main id="app"></main>
<script>
'use strict';

// Igal real on sõna, pilt ja teema. Siia saab sõnu juurde lisada.
const data = [
  ['KALA','🐟','meri'], ['KRABI','🦀','meri'], ['HÜLJES','🦭','meri'],
  ['VAAL','🐋','meri'], ['HAI','🦈','meri'], ['DELFIIN','🐬','meri'],
  ['KARP','🐚','meri'], ['PAAT','⛵','meri'], ['LAEV','🚢','meri'],
  ['KASS','🐱','loom'], ['KOER','🐶','loom'], ['KARU','🐻','loom'],
  ['REBANE','🦊','loom'], ['JÄNES','🐰','loom'], ['SIIL','🦔','loom'],
  ['ORAV','🐿️','loom'], ['KONN','🐸','loom'], ['TIGU','🐌','loom'],
  ['SIGA','🐷','talu'], ['LEHM','🐮','talu'], ['LAMMAS','🐑','talu'],
  ['HOBUNE','🐴','talu'], ['KANA','🐔','talu'], ['TIBU','🐥','talu'],
  ['PART','🦆','talu'], ['KITS','🐐','talu'], ['KUKK','🐓','talu'],
  ['ÕUN','🍎','toit'], ['PIRN','🍐','toit'], ['PLOOM','🟣','toit'],
  ['BANAAN','🍌','toit'], ['SIDRUN','🍋','toit'], ['KIRSS','🍒','toit'],
  ['MAASIKAS','🍓','toit'], ['PORGAND','🥕','toit'], ['KURK','🥒','toit'],
  ['PÄIKE','☀️','loodus'], ['KUU','🌙','loodus'], ['TÄHT','⭐','loodus'],
  ['PILV','☁️','loodus'], ['PUU','🌳','loodus'], ['LILL','🌷','loodus'],
  ['LEHT','🍁','loodus'], ['SEEN','🍄','loodus'], ['VIHM','🌧️','loodus'],
  ['AUTO','🚗','sõiduk'], ['BUSS','🚌','sõiduk'], ['RONG','🚂','sõiduk']
].map(([word, icon, group]) => ({word, icon, group}));

// Ploomi jaoks joonistame viljale ka varre ja lehe.
function picture(item) {
  if (item.word === 'PLOOM') {
    return '<svg aria-hidden="true" viewBox="0 0 100 100" style="width:1em;height:1em;vertical-align:-.08em">' +
      '<ellipse cx="49" cy="61" rx="29" ry="33" fill="#79589c"/>' +
      '<ellipse cx="38" cy="52" rx="7" ry="12" fill="#bba0cb"/>' +
      '<path d="M50 31q0-12 9-21" fill="none" stroke="#705234" stroke-width="5"/>' +
      '<path d="M54 23q-19-19-28-9 10 14 28 9" fill="#62895a"/></svg>';
  }
  return item.icon;
}

const games = {
  match: ['🦭','Leia sama pilt', matching],
  letter: ['🔠','Leia sama täht', letters],
  word: ['🧱','Lao sõna', spelling],
  puzzle: ['🧩','Pane pusle kokku', puzzle],
  diff: ['🔎','Leia erinevused', differences],
  count: ['🐸','Konna hüpped', counting],
  memory: ['✨','Jäta meelde', memory],
  first: ['🎒','Leia algustäht', firstLetter]
};

const app = document.getElementById('app');
const get = id => document.getElementById(id);
const alphabet = [...new Set(data.flatMap(item => [...item.word]))];
const bags = new Map();
const timers = new Set();
const total = 8;
let mode, deck, round, locked, voicePrompt = '';
let soundOn = true, audio, homeVisit = 0;
let memoryPlaying = false;
let earned = 0;
try { earned = Number(localStorage.getItem('rannasober-stars')) || 0 } catch {}

function shuffle(list) {
  const copy = [...list];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

// Iga mäng mäletab sama lehekülastuse jooksul kasutatud pilte.
function drawDeck(key, pool, size) {
  let bag = bags.get(key) || [];
  const result = [];
  while (result.length < size) {
    if (!bag.length) {
      const remaining = shuffle(pool.filter(x => !result.includes(x)));
      bag = [...shuffle(pool.filter(x => result.includes(x))), ...remaining];
    }
    result.push(bag.pop());
  }
  bags.set(key, bag);
  return result;
}
function later(action, delay) {
  const id = setTimeout(() => { timers.delete(id); action() }, delay);
  timers.add(id);
}
function cancelPending() {
  timers.forEach(clearTimeout);
  timers.clear();
  memoryPlaying = false;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}
function unlockAudio() {
  if (!soundOn) return;
  try {
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) return;
    if (!audio) audio = new Audio();
    if (audio.state === 'suspended') audio.resume().catch(() => {});
  } catch {}
}
function tone(freq = 440, duration = .12, offset = 0) {
  if (!soundOn || !audio || audio.state !== 'running') return;
  const start = audio.currentTime + offset;
  const osc = audio.createOscillator(), gain = audio.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(.001, start);
  gain.gain.exponentialRampToValueAtTime(.085, start + .018);
  gain.gain.exponentialRampToValueAtTime(.001, start + duration);
  osc.connect(gain); gain.connect(audio.destination);
  osc.start(start); osc.stop(start + duration + .02);
  osc.onended = () => { osc.disconnect(); gain.disconnect() };
}
function estonianVoice() {
  if (!('speechSynthesis' in window)) return null;
  return speechSynthesis.getVoices().find(v => /^et(?:[-_]|$)/i.test(v.lang));
}
function speak(text) {
  if (!soundOn || !text) return false;
  const voice = estonianVoice();
  if (!voice) return false;
  speechSynthesis.cancel();
  const line = new SpeechSynthesisUtterance(text);
  line.voice = voice; line.lang = 'et-EE'; line.rate = .82;
  speechSynthesis.speak(line);
  return true;
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
function tell(text) {
  voicePrompt = text;
  speak(text);
}
function status(text) {
  const node = get('status');
  if (node) node.textContent = text;
}
function button(parent, label, html, action, css = '') {
  const b = document.createElement('button');
  b.type = 'button'; b.className = css;
  b.setAttribute('aria-label', label);
  b.innerHTML = html;
  b.onclick = () => { unlockAudio(); action(b) };
  parent.append(b);
  return b;
}
function bump(b) {
  b.classList.remove('hint');
  void b.offsetWidth;
  b.classList.add('hint');
  tone(300, .09);
}
function sparkle() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for (let i = 0; i < 7; i++) {
    const s = document.createElement('span');
    s.className = 'spark'; s.textContent = i % 2 ? '✦' : '⭐';
    s.setAttribute('aria-hidden', 'true');
    const angle = Math.PI * 2 * i / 7;
    s.style.setProperty('--dx', Math.cos(angle) * 90 + 'px');
    s.style.setProperty('--dy', Math.sin(angle) * 70 - 30 + 'px');
    document.body.append(s);
    setTimeout(() => s.remove(), 800);
  }
}
function controls(parent, withReplay) {
  const sound = button(parent, 'Mänguheli', '', b => {
    soundOn = !soundOn;
    if (soundOn) { unlockAudio(); tone(520); speak(voicePrompt) }
    else if ('speechSynthesis' in window) speechSynthesis.cancel();
    paint(b);
  }, 'small');
  function paint(b) {
    b.textContent = soundOn ? '🔊' : '🔇';
    b.setAttribute('aria-pressed', String(soundOn));
  }
  paint(sound);
  if (withReplay) button(parent, 'Kuula juhist uuesti', '👂 Kuula', () => {
    if (!soundOn) { status('Heli saad sisse lülitada kõlarinupust.'); return }
    if (!speak(voicePrompt)) {
      tone(520);
      status('Eesti kõnehääl pole seadmes saadaval. Jälgi pildilist vihjet.');
    }
  }, 'small');
}
function home() {
  cancelPending(); locked = false; voicePrompt = ''; homeVisit++;
  app.innerHTML =
    '<header><span>⭐ ' + earned + '</span><div class="tools" id="tools"></div></header>' +
    '<div class="hero"><button class="mascot" id="seal" aria-label="Tervita hüljest">🦭</button>' +
    '<h1>Rannasõbra mängusaar</h1></div><h2>Vali mäng</h2><div class="menu" id="menu"></div>';
  controls(get('tools'), false);
  get('seal').onclick = () => {
    unlockAudio(); sparkle(); tone(480); tone(640, .15, .12);
    speak(homeVisit % 2 ? 'Tere, rannasõber! Vali mäng.' : 'Tere tulemast mängusaarele!');
  };
  for (const [key, [icon, name]] of Object.entries(games)) {
    button(get('menu'), name, '<span class="icon">' + icon + '</span>' + name, () => {
      tone(480); start(key);
    });
  }
}
function start(key) {
  cancelPending(); mode = key; round = 0;
  // Väga pikkade sõnade täherida võib algajale olla raske.
  const pool = key === 'word' ? data.filter(x => x.word.length <= 6) : data;
  deck = drawDeck(key, pool, total);
  showRound();
}
function showRound() {
  cancelPending(); locked = false;
  app.innerHTML =
    '<header><div id="nav"></div><span class="progress">🐚 ' + (round + 1) + ' / ' + total +
    '</span><div class="tools" id="tools"></div></header><h2>' + games[mode][1] +
    '</h2><div class="sheet"><div class="stage" id="stage"></div>' +
    '<p role="status" id="status"></p></div>';
  button(get('nav'), 'Tagasi mänguvalikusse', '⌂ Avaleht', home, 'small');
  controls(get('tools'), true);
  games[mode][2](deck[round]);
}
function finish(b) {
  if (locked) return;
  locked = true;
  if (b) b.classList.add('ok');
  earned++;
  try { localStorage.setItem('rannasober-stars', String(earned)) } catch {}
  sparkle(); tone(523, .13); tone(659, .13, .12); tone(784, .18, .24);
  status('⭐ Tubli! Üks täht juures.');
  later(() => { round++; round < total ? showRound() : treasure() }, 1150);
}
function treasure() {
  cancelPending();
  app.innerHTML =
    '<div class="hero"><h1>Sinu aardelaegas</h1></div><div class="sheet stage">' +
    '<div id="chest"></div><p id="reward" role="status">Puuduta laegast!</p>' +
    '<div class="row" id="again"></div></div>';
  button(get('chest'), 'Ava aardelaegas', '🎁', b => {
    b.disabled = true; b.textContent = '💎'; sparkle();
    tone(523); tone(659, .14, .12); tone(880, .22, .24);
    get('reward').textContent = 'Leidsid aarde! Sul on kokku ' + earned + ' tähte.';
    tell('Leidsid aarde! Tubli!');
  }, 'sample');
  button(get('again'), 'Järgmised kaheksa vooru', '▶ Mängi edasi', () => start(mode));
  button(get('again'), 'Vali teine mäng', '⌂ Vali mäng', home);
}
function rows(sampleHTML) {
  get('stage').innerHTML = '<div id="sample" class="sample">' + sampleHTML +
    '</div><div class="row" id="options"></div>';
}
function options(correct, candidates, render, label, instruction) {
  const n = round < 2 ? 2 : round < 5 ? 3 : 4;
  const wrong = shuffle(candidates.filter(x => x !== correct)).slice(0, n - 1);
  for (const x of shuffle([correct, ...wrong])) {
    button(get('options'), label(x), render(x), b => {
      if (locked) return;
      if (x === correct) finish(b);
      else { bump(b); status('Proovi veel.'); speak(instruction) }
    }, 'card');
  }
  tell(instruction);
}
function matching(item) {
  rows(picture(item));
  options(item, data, picture, x => x.word, 'Leia sama pilt. ' + item.word.toLowerCase() + '.');
}
function letters(item) {
  const c = item.word[0];
  rows(c);
  options(c, alphabet, x => x, x => 'Täht ' + x, 'Leia sama täht. ' + c + '.');
}
function firstLetter(item) {
  const c = item.word[0];
  rows(picture(item));
  // Sõnamudel aitab ka last, kes alles õpib häälikuid kuulama.
  get('sample').insertAdjacentHTML('beforeend',
    '<div style="font-size:24px;letter-spacing:2px"><strong style="color:#a54919">' +
    c + '</strong>' + item.word.slice(1) + '</div>');
  options(c, alphabet, x => x, x => 'Täht ' + x,
    item.word.toLowerCase() + '. Millise tähega see sõna algab?');
}
function spelling(item) {
  let cursor = 0;
  const chars = [...item.word];
  get('stage').innerHTML =
    '<div class="sample">' + picture(item) + '</div><div class="slots" id="slots"></div>' +
    '<div class="row" id="tiles"></div>';
  for (const c of chars) {
    const s = document.createElement('span');
    s.className = 'slot'; s.textContent = c; get('slots').append(s);
  }
  const slots = get('slots').children;
  slots[0].classList.add('next');
  for (const c of shuffle(chars)) {
    button(get('tiles'), 'Täht ' + c, c, b => {
      if (locked) return;
      if (c !== chars[cursor]) {
        bump(b); status('Otsi tähte ' + chars[cursor] + '.'); return;
      }
      b.disabled = true; b.classList.add('used');
      slots[cursor].className = 'slot filled'; tone(430 + cursor * 55);
      cursor++;
      if (cursor === chars.length) {
        speak(item.word.toLowerCase()); finish(); return;
      }
      slots[cursor].classList.add('next');
      voicePrompt = 'Leia täht ' + chars[cursor] + '.';
      status(voicePrompt);
    }, 'tile');
  }
  tell('Lao sõna ' + item.word.toLowerCase() + '. Leia täht ' + chars[0] + '.');
}

// Tükid on ühe tervikpildi neli lõiget. Ka taust jätkub üle tükkide piiride.
function puzzleArt(item, i) {
  const box = ['0 0 50 50','50 0 50 50','0 50 50 50','50 50 50 50'][i];
  const icon = item.word === 'PLOOM'
    ? '<ellipse cx="50" cy="55" rx="23" ry="29" fill="#79589c"/><path d="M50 28q0-12 9-18" fill="none" stroke="#705234" stroke-width="3"/><path d="M52 22q-14-14-22-9 7 11 22 9" fill="#62895a"/>'
    : '<text x="50" y="74" text-anchor="middle" font-size="68">' + item.icon + '</text>';
  return '<svg aria-hidden="true" viewBox="' + box + '">' +
    '<rect width="100" height="100" fill="#c9eff0"/>' +
    '<circle cx="18" cy="18" r="10" fill="#ffd46a"/>' +
    '<path d="M0 66Q30 49 55 68T100 63V100H0Z" fill="#86c8aa"/>' +
    '<path d="M0 87Q42 67 100 90V100H0Z" fill="#f3cf92"/>' +
    icon + '</svg>';
}
function puzzle(item) {
  const labels = ['ülemine vasak','ülemine parem','alumine vasak','alumine parem'];
  const order = round < 3 ? [0,1,2,3] : shuffle([0,1,2,3]);
  let step = 0;
  get('stage').innerHTML = '<div class="board" id="board"></div><div class="row" id="pieces"></div>';
  for (let i = 0; i < 4; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell'; cell.innerHTML = puzzleArt(item, i);
    get('board').append(cell);
  }
  const cells = get('board').children;
  cells[order[0]].classList.add('active');
  for (const i of shuffle([0,1,2,3])) {
    button(get('pieces'), labels[i] + ' tükk', puzzleArt(item, i), b => {
      if (locked) return;
      if (i !== order[step]) { bump(b); status('Vaata punktiiriga ruutu.'); return }
      b.disabled = true; b.classList.add('used');
      cells[i].className = 'cell placed'; tone(440 + step * 70);
      if (++step === 4) { speak(item.word.toLowerCase()); finish(); return }
      cells[order[step]].classList.add('active');
      status('Leia järgmine tükk.');
    }, 'piece');
  }
  tell('Leia punktiiriga ruutu sobiv tükk.');
}
function differences(item) {
  const pool = shuffle(data.filter(x => x !== item));
  const left = [item, ...pool.slice(0,3)], right = [...left];
  const changes = shuffle([0,1,2,3]).slice(0, round < 3 ? 1 : 2);
  changes.forEach((pos, j) => { right[pos] = pool[3 + j] });
  const found = new Set();
  get('stage').innerHTML =
    '<p id="task"></p><div class="pair"><div class="picture" id="left"></div>' +
    '<div class="picture" id="right"></div></div>';
  const instruction = changes.length === 1 ? 'Leia üks erinevus.' : 'Leia kaks erinevust.';
  get('task').textContent = instruction;
  for (const [side, list] of [['left',left],['right',right]]) {
    list.forEach((x, i) => button(get(side), x.word, picture(x), b => {
      if (locked || found.has(i)) return;
      if (!changes.includes(i)) { bump(b); status('Need pildid on ühesugused.'); return }
      found.add(i);
      for (const id of ['left','right']) get(id).children[i].classList.add('found');
      if (found.size === changes.length) finish();
      else { tone(620); status('Üks erinevus veel!'); speak('Üks veel!') }
    }, 'spot'));
  }
  tell(instruction);
}
function counting() {
  const n = 1 + Math.floor(Math.random() * (round < 3 ? 3 : 5));
  let jumped = 0;
  get('stage').innerHTML =
    '<div class="sample" style="font-size:44px">🐸</div><p>Tee ' + n +
    (n === 1 ? ' hüpe' : ' hüpet') + '</p><div class="count">' + '💧'.repeat(n) +
    '</div><div class="pond" id="pond"></div>';
  for (let i = 1; i <= n; i++) {
    button(get('pond'), 'Vesiroosileht ' + i, String(i), b => {
      if (locked) return;
      if (i !== jumped + 1) { bump(b); status('Leia leht numbriga ' + (jumped + 1) + '.'); return }
      const previous = get('pond').querySelector('.frog');
      if (previous) previous.remove();
      b.insertAdjacentHTML('beforeend','<span class="frog" aria-hidden="true">🐸</span>');
      b.classList.add('ok');
      jumped++; tone(340 + 80 * i); speak(String(i));
      if (jumped === n) finish();
      else status('Järgmine leht on ' + (jumped + 1) + '.');
    }, 'pad');
  }
  tell('Aita konnal hüpata. Alusta esimesest lehest.');
}
function memory(item) {
  const list = shuffle([item, ...shuffle(data.filter(x => x !== item)).slice(0, 2)]);
  const length = round < 3 ? 2 : round < 7 ? 3 : 4;
  const sequence = [];
  for (let i = 0; i < length; i++) {
    const possible = [0,1,2].filter(j => j !== sequence[i - 1]);
    sequence.push(shuffle(possible)[0]);
  }
  let cursor = 0;
  get('stage').innerHTML =
    '<p id="memoryHint"></p><div class="row" id="cards"></div><div id="repeat"></div>';
  const cards = list.map((x, i) => button(get('cards'), x.word, picture(x), b => {
    if (locked || memoryPlaying) return;
    if (sequence[cursor] !== i) {
      bump(b); replay(); return;
    }
    tone([440,554,659][i]); b.classList.add('ok');
    later(() => b.classList.remove('ok'), 220);
    cursor++;
    if (cursor === length) finish(b);
    else status('Õige! Veel ' + (length - cursor) + '.');
  }, 'card'));
  function replay() {
    if (locked || memoryPlaying) return;
    cursor = 0; memoryPlaying = true; status('');
    get('memoryHint').textContent = '👀 Vaata järjekorda';
    cards.forEach(b => { b.disabled = true; b.classList.remove('ok') });
    sequence.forEach((idx, j) => {
      const start = 550 + j * 900;
      later(() => { cards[idx].classList.add('lit'); tone([440,554,659][idx], .32) }, start);
      later(() => cards[idx].classList.remove('lit'), start + 620);
    });
    later(() => {
      memoryPlaying = false; cards.forEach(b => { b.disabled = false });
      get('memoryHint').textContent = '☝️ Nüüd puuduta samas järjekorras';
      voicePrompt = 'Nüüd on sinu kord.'; speak(voicePrompt);
    }, 550 + length * 900);
  }
  button(get('repeat'), 'Näita järjekorda uuesti', '↻ Näita uuesti', replay, 'small');
  tell('Vaata, millised pildid süttivad.');
  replay();
}
home();
</script>

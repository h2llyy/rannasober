<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7fd3dc">
<title>Rannasõbra aardesaar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#123c4a; --ink2:#2c6170; --edge:#c49a62; --cream:#fff9ea;
  --sea:#0f8f96; --coral:#ff7b6b; --sun:#ffd25e; --leaf:#45b37a;
  --font:'Baloo 2',ui-rounded,'Segoe UI Rounded','Trebuchet MS',system-ui,sans-serif;
  --mx:0; --my:0;
}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;min-height:100dvh;overflow-x:hidden;font:600 18px/1.35 var(--font);color:var(--ink);background:#bde9e6;isolation:isolate}
button,select,input{font:inherit;color:inherit}
button{
  background:linear-gradient(160deg,#fffefa,#ffefc9);border:2px solid #47716d;border-radius:18px;
  min-height:48px;padding:8px 14px;cursor:pointer;
  box-shadow:inset 0 3px 1px #fffd,0 5px 0 var(--edge),0 9px 16px #19465426;
  touch-action:manipulation;transition:transform .15s,box-shadow .15s,filter .15s;
}
@media(hover:hover){button:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.05)}}
button:active:not(:disabled){transform:translateY(4px) scale(.97);box-shadow:inset 0 2px 3px #896c4433,0 1px 0 var(--edge)}
button:focus-visible,input:focus-visible{outline:4px solid #ad5418;outline-offset:3px}
button:disabled{cursor:default}
main{width:min(94%,980px);margin:auto;padding:12px 0 170px;text-align:center}
h1,h2,h3{margin:.2em 0;line-height:1.05;text-wrap:balance;font-weight:800}
h2{font-size:clamp(28px,4.6vw,44px);color:#0f4a57;text-shadow:0 3px 0 #ffffffaa}
h3{font-size:clamp(22px,3vw,28px);color:#0f4a57}
p{margin:.4em 0}
.row,.tools,.slots{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px}
.small{font-size:16px;padding:6px 12px;min-height:44px}
.note{font-size:15px;color:var(--ink2)}

/* ---------- Taust ---------- */
.seascape{position:fixed;inset:0;overflow:hidden;z-index:-2;pointer-events:none;
  background:linear-gradient(#7fd0ea 0%,#d9f5f0 52%,#7dd3d0 52.2%,#2aa3ad 78%,#f3d8a2 78.3%,#fff1cb 100%)}
.layer{position:absolute;inset:0;transition:transform .4s ease-out}
.far{transform:translate(calc(var(--mx)*-14px),calc(var(--my)*-8px))}
.mid{transform:translate(calc(var(--mx)*-30px),calc(var(--my)*-10px))}
.sun{position:absolute;right:9%;top:7%;width:14vmin;height:14vmin;border-radius:50%;
  background:radial-gradient(circle,#fff7c2 0 45%,#ffd864 70%);box-shadow:0 0 50px 18px #ffe9864d;transition:all 1s}
.sun::before{content:'';position:absolute;inset:-60%;border-radius:50%;
  background:repeating-conic-gradient(#fff3a866 0 8deg,transparent 8deg 22deg);
  mask:radial-gradient(circle,transparent 30%,#000 32%,transparent 70%);-webkit-mask:radial-gradient(circle,transparent 30%,#000 32%,transparent 70%);
  animation:spin 40s linear infinite}
.sun.whee{animation:spin 1s ease-in-out}
@keyframes spin{to{transform:rotate(1turn)}}
.cloud{position:absolute;font-size:clamp(40px,7vw,90px);opacity:.88;filter:drop-shadow(0 6px 6px #ffffff88)}
.cloud.c1{left:4%;top:7%;animation:drift 26s ease-in-out infinite alternate}
.cloud.c2{left:38%;top:16%;font-size:clamp(28px,4.5vw,60px);opacity:.7;animation:drift 34s ease-in-out infinite alternate-reverse}
.cloud.c3{left:62%;top:4%;font-size:clamp(24px,3.5vw,48px);opacity:.6;animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(12vw)}}
.bird{position:absolute;top:22%;left:-8%;width:34px;animation:fly 28s linear infinite}
.bird.b2{top:27%;width:24px;animation-duration:36s;animation-delay:-14s}
@keyframes fly{to{transform:translateX(118vw) translateY(-6vh)}}
.bird path{animation:flap .5s ease-in-out infinite alternate;transform-origin:center}
@keyframes flap{to{transform:scaleY(.4)}}
.isle-bg{position:absolute;left:4%;top:39.5%;width:clamp(150px,22vw,280px)}
.lh-light{opacity:0;transition:opacity 1s}
.boat{position:absolute;top:46%;left:-10%;font-size:clamp(30px,5vw,54px);animation:sail 60s linear infinite}
.boat.honk{filter:drop-shadow(0 0 12px #fff)}
@keyframes sail{0%{transform:translateX(0) rotate(-3deg)}50%{transform:translateX(60vw) rotate(3deg)}100%{transform:translateX(125vw) rotate(-3deg)}}
.wave{position:absolute;left:-25%;width:150%;height:13%}
.wave.one{top:55%;color:#9de6e0;animation:swell 8s ease-in-out infinite alternate}
.wave.two{top:63%;color:#55c1c4;animation:swell 6s ease-in-out infinite alternate-reverse}
.wave.three{top:71%;color:#c9f2ea;animation:swell 7s ease-in-out infinite alternate}
@keyframes swell{to{transform:translate(8%,7px)}}
.shell{position:absolute;font-size:clamp(20px,3vw,32px);bottom:5%}
.stars{position:absolute;inset:0 0 50%;opacity:0;transition:opacity 1s;
  background-image:radial-gradient(2px 2px at 10% 20%,#fff,transparent),radial-gradient(2px 2px at 30% 10%,#fff,transparent),
  radial-gradient(1.5px 1.5px at 50% 30%,#fff,transparent),radial-gradient(2px 2px at 70% 15%,#fff,transparent),
  radial-gradient(1.5px 1.5px at 85% 35%,#fff,transparent),radial-gradient(2px 2px at 20% 40%,#fff,transparent),
  radial-gradient(1.5px 1.5px at 60% 45%,#fff,transparent),radial-gradient(2px 2px at 92% 8%,#fff,transparent);
  animation:twinkle 3s ease-in-out infinite alternate}
@keyframes twinkle{to{filter:brightness(.5)}}
body.night .seascape{background:linear-gradient(#0d2347 0%,#2b4f84 52%,#1f6f8a 52.2%,#0f3e5c 78%,#8f8a7a 78.3%,#b6aa8c 100%)}
body.night .stars{opacity:1}
body.night .sun{background:radial-gradient(circle at 35% 35%,#fffbe8 0 55%,#e8e2c0 70%);box-shadow:0 0 40px 12px #fffbe233}
body.night .sun::before{opacity:0}
body.night .cloud{opacity:.35}
body.night .lh-light{opacity:1;animation:beam 2s ease-in-out infinite alternate}
@keyframes beam{to{opacity:.3}}
body.night .wave.one{color:#2c7f99}body.night .wave.two{color:#1d5f7c}body.night .wave.three{color:#3a8ca0}
#seaLife{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}

/* ---------- Krabi ---------- */
#beachCrab{position:fixed;z-index:3;bottom:6px;left:1%;min-width:54px;background:none;border:0;box-shadow:none;padding:0;
  font-size:38px;filter:drop-shadow(0 3px 2px #62432155);animation:scuttle 23s ease-in-out infinite alternate}
@keyframes scuttle{0%,8%{left:1%}43%,49%{left:35%}92%,100%{left:calc(70% - 55px)}}
#beachCrab span{display:block}
#beachCrab.dance span{animation:dance .48s ease-in-out 2}
@keyframes dance{30%{transform:translateY(-14px) rotate(14deg)}65%{transform:rotate(-14deg)}}

/* ---------- Hüljes ---------- */
.buddy{position:fixed;z-index:6;right:max(6px,env(safe-area-inset-right));bottom:4px;background:none;border:0;box-shadow:none;padding:0;min-height:0}
.buddy:hover,.buddy:active{transform:none!important;box-shadow:none!important}
.buddy svg{display:block;width:clamp(96px,17vmin,150px);overflow:visible;filter:drop-shadow(0 7px 5px #1e4a5640)}
.buddy::before{content:'';position:absolute;left:8%;right:8%;bottom:2px;height:16px;border-radius:50%;border:3px solid #ffffff99;animation:ripple2 2.6s ease-out infinite}
@keyframes ripple2{from{transform:scale(.8);opacity:1}to{transform:scale(1.35);opacity:0}}
.buddy .sealbody,.buddy .head,.buddy .eyes,.buddy .flipL,.buddy .flipR,.buddy .tail,.buddy .mouthO,.buddy .hat{transform-box:fill-box}
.buddy .sealbody{transform-origin:50% 100%;animation:sbob 2.6s ease-in-out infinite}
@keyframes sbob{50%{transform:translateY(-4px) scaleY(1.02)}}
.buddy .head{transform-origin:50% 90%;animation:headTilt 6s ease-in-out infinite}
@keyframes headTilt{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}60%{transform:rotate(5deg)}}
.buddy .eyes{transform-origin:center;transition:transform .08s}
.buddy.blink .eyes{transform:scaleY(.1)}
.buddy .flipL{transform-origin:85% 15%}
.buddy .flipR{transform-origin:15% 15%}
.buddy.wave .flipL{animation:waveFlip .35s ease-in-out 4}
@keyframes waveFlip{50%{transform:rotate(40deg)}}
.buddy .tail{transform-origin:0 50%;animation:tailWag 1.4s ease-in-out infinite}
@keyframes tailWag{50%{transform:rotate(-14deg)}}
.buddy .hat{transform-origin:50% 100%}
.buddy.happy .hat{animation:hatPop .5s ease-out 2}
@keyframes hatPop{40%{transform:translateY(-8px) rotate(-10deg)}}
.buddy .mouthO{opacity:0;transform-origin:center}
.buddy.talk .mouth{opacity:0}
.buddy.talk .mouthO{opacity:1;animation:yap .18s infinite alternate}
@keyframes yap{to{transform:scaleY(.35)}}
.buddy.happy .sealbody{animation:hop .5s ease-out 2}
.buddy.flip .sealbody{animation:flipJump .9s ease-in-out}
.buddy.think .head{animation:tilt .6s ease-in-out 2}
@keyframes hop{40%{transform:translateY(-26px) scale(1.06)}}
@keyframes flipJump{40%{transform:translateY(-46px) rotate(-180deg)}85%{transform:translateY(0) rotate(-360deg)}100%{transform:rotate(-360deg)}}
@keyframes tilt{30%{transform:rotate(-16deg)}70%{transform:rotate(12deg)}}
.buddy .say{position:absolute;right:70%;bottom:86%;width:max-content;max-width:min(62vw,260px);background:#fff;color:var(--ink);
  border:3px solid #0f8f96;border-radius:20px 20px 4px 20px;padding:7px 14px;font-size:17px;font-weight:700;line-height:1.2;text-align:left;
  box-shadow:0 6px 14px #0f3e4a33;opacity:0;transform:scale(.4) translateY(14px);transform-origin:100% 100%;transition:.25s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
.buddy.talk .say{opacity:1;transform:none}

/* ---------- Päis ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fffdf3;border:2px solid #e2c27c;border-radius:999px;
  padding:4px 14px;font-weight:800;font-size:19px;box-shadow:0 4px 0 #d6b46b88}
.chip b{display:inline-block;min-width:1.3em}
.chip.bump b{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.5);color:#d36a00}}
.chip.rank{background:linear-gradient(#1d3b6a,#14294c);color:#ffe9a8;border-color:#0d1c36;box-shadow:0 4px 0 #0d1c3688;font-size:17px}
.progress{flex:1;min-width:140px;max-width:340px;position:relative;height:30px;border-radius:999px;background:#ffffffb0;border:2px solid #9cc9c3;overflow:hidden}
.progress .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#5fd3c4,#3bb0c9);border-radius:999px;transition:width .6s cubic-bezier(.3,1.4,.5,1)}
.progress span{position:relative;font-weight:800;font-size:16px;line-height:26px}
.streak{font-size:15px;color:#c0471a;font-weight:800;min-height:1.2em}

/* ---------- Avaleht ---------- */
.hero{font-size:clamp(60px,11vmin,100px);line-height:1;filter:drop-shadow(0 8px 4px #416e7133);animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px) rotate(2deg)}}
.title{font-size:clamp(38px,7.4vw,76px);color:#0d4f5c;letter-spacing:.5px}
.title .word{display:inline-block;white-space:nowrap}
.title .word span{display:inline-block;animation:wave 3.2s ease-in-out infinite;animation-delay:calc(var(--i)*.07s);text-shadow:0 3px 0 #fff,0 6px 0 #00000014}
@keyframes wave{0%,60%,100%{transform:none}30%{transform:translateY(-9px)}}
.tag{font-size:clamp(17px,2.3vw,21px);color:var(--ink2)}
.seg{display:inline-flex;background:#ffffffb5;border:2px solid #9cc9c3;border-radius:999px;padding:3px;gap:3px}
.seg button{min-height:38px;padding:2px 16px;border:0;box-shadow:none;background:none;border-radius:999px}
.seg button[aria-pressed="true"]{background:#0f8f96;color:#fff}
.feature{position:relative;width:100%;min-height:170px;margin:16px 0 6px;overflow:hidden;border:4px solid #0d5f6e;border-radius:30px;padding:20px 24px;
  display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;text-align:left;color:#fff;
  background:linear-gradient(#2a8fc0,#5cc4dc 52%,#1d8aa3 52.5%,#0e5f7d);box-shadow:inset 0 3px #ffffff55,0 7px 0 #0d5f6e,0 16px 26px #0d3e4a44;animation:popIn .5s backwards}
.feature .ftitle{display:block;font-size:clamp(28px,4.6vw,46px);font-weight:800;line-height:1;text-shadow:0 3px 0 #0b4a5a}
.feature .fsub{display:block;font-size:clamp(15px,2vw,19px);text-shadow:0 2px 0 #0b4a5a;margin-top:6px;max-width:34em}
.feature .fprog{display:inline-block;margin-top:10px;background:#ffffff2e;border:2px solid #ffffff88;border-radius:999px;padding:2px 12px;font-size:16px}
.feature .fisland{font-size:clamp(64px,11vw,110px);animation:float 3.5s ease-in-out infinite;filter:drop-shadow(0 8px 4px #0004)}
.feature .fship{position:absolute;bottom:20%;left:-12%;font-size:clamp(34px,5vw,50px);animation:fsail 14s linear infinite}
@keyframes fsail{0%{left:-12%;transform:rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}100%{left:105%;transform:rotate(-4deg)}}
.feature .fwave{position:absolute;left:-10%;bottom:-4px;width:120%;height:34%;color:#ffffff30;animation:swell 5s ease-in-out infinite alternate;pointer-events:none}
.section{display:flex;align-items:center;gap:10px;margin:22px 4px 4px;font-size:clamp(22px,3vw,28px);font-weight:800;color:#0f4a57}
.section::after{content:'';flex:1;height:8px;background:radial-gradient(circle at 4px 4px,#0f8f9655 3px,transparent 3.5px) 0 0/14px 8px repeat-x}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin:12px auto}
.menu button{--c:#4cc3d9;position:relative;min-height:128px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:clamp(15px,1.9vw,18px);font-weight:800;line-height:1.1;padding:10px 6px;border:3px solid var(--c);border-radius:24px;
  background:#fff;background:linear-gradient(170deg,#fff 40%,color-mix(in srgb,var(--c) 28%,#fff));
  box-shadow:inset 0 3px #fff,0 6px 0 var(--c),0 12px 18px #19465430;animation:popIn .5s backwards;animation-delay:calc(var(--d)*50ms)}
.menu .icon{display:block;font-size:clamp(36px,6vmin,54px);filter:drop-shadow(0 4px 2px #604d3133);transition:transform .3s}
@media(hover:hover){.menu button:hover .icon{transform:scale(1.2) rotate(-8deg)}}
.menu .medal{position:absolute;top:-10px;right:-6px;background:var(--sun);border:2px solid #c99a26;border-radius:999px;padding:0 7px;font-size:13px;line-height:22px}
.menu .new{position:absolute;top:-10px;left:-6px;background:#ff7b6b;color:#fff;border-radius:999px;padding:0 8px;font-size:12px;line-height:22px;animation:pulse 1.4s infinite}
.extra button{font-size:19px;padding:10px 20px}
@keyframes popIn{from{opacity:0;transform:scale(.6) translateY(20px)}}

/* ---------- Mänguala ---------- */
.panel{position:relative;background:linear-gradient(150deg,#fffdf6f7,#fff4ddf2);border:3px solid #ffffffcc;
  box-shadow:inset 0 3px #fff,0 8px 0 #c6b39280,0 18px 30px #29565b2e;border-radius:30px;padding:clamp(14px,2.6vw,28px);margin:12px auto;animation:popIn .4s}
.panel::before{content:'';position:absolute;inset:6px;border-radius:24px;border:2px dashed #e6cfa0;pointer-events:none}
.stage{display:grid;gap:clamp(8px,2vh,18px);justify-items:center;position:relative}
.sample{font-size:clamp(56px,12vmin,100px);line-height:1.12;animation:float 3s ease-in-out infinite}
.sample.letter{font-weight:800;color:#0f6b74;text-shadow:0 5px 0 #0f6b7422}
.card{min-width:clamp(70px,14vw,124px);min-height:clamp(70px,14vw,110px);font-size:clamp(36px,7.5vmin,62px);font-weight:800;padding:5px 12px;
  animation:popIn .4s backwards;animation-delay:calc(var(--d,0)*80ms)}
.tile{min-width:52px;font-size:clamp(26px,5vmin,40px);font-weight:800;padding:4px 12px;background:linear-gradient(160deg,#fff,#ffe6a8);animation:popIn .4s backwards;animation-delay:calc(var(--d,0)*50ms)}
.slot{display:inline-grid;place-items:center;min-width:clamp(32px,6vw,52px);height:clamp(44px,8vw,64px);font-size:clamp(22px,4.5vw,38px);font-weight:800;
  border-radius:12px;background:#ffffff90;border:2px dashed #aeb8a6;color:#b8c4bd}
.slot.next{background:#ffe9ac;border:3px solid #e08a2e;color:#c58b4b;animation:pulse 1.2s infinite}
.slot.hidden{color:transparent}
.slot.filled{background:#d9f3c9;border:3px solid #4c9966;color:#1d5a3a;animation:pop .35s}
@keyframes pulse{50%{box-shadow:0 0 0 6px #ffd27a66}}
@keyframes pop{50%{transform:scale(1.25)}}
.used{visibility:hidden}
.ok,.found,.lit{background:linear-gradient(#fbffcd,#9fe3aa)!important;border-color:#2f8a52!important}
.ok{animation:pop .4s}
.lit{outline:6px solid #ffb627;transform:translateY(-6px) scale(1.08)}
.glow{animation:glow 1s ease-in-out infinite!important;border-color:#e08a2e!important}
@keyframes glow{50%{box-shadow:0 0 0 8px #ffcc5588,0 0 26px 8px #ffd56b;transform:scale(1.08)}}
#status{min-height:1.5em;color:#1f6155;font-weight:700;font-size:19px}
.shake,.nope{animation:shake .4s ease-in-out}
@keyframes shake{20%{transform:translateX(-8px) rotate(-4deg)}40%{transform:translateX(7px) rotate(3deg)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.pair{display:flex;width:100%;justify-content:center;gap:12px}
.picture,.board{display:grid;grid-template-columns:repeat(2,1fr);overflow:hidden;border:4px solid #698b7e;border-radius:18px;background:#fff}
.picture{width:min(45%,240px);cursor:zoom-in}
.spot{min-width:0;aspect-ratio:1.25;border:1px solid #d5dfc9;border-radius:0;box-shadow:none;padding:0;font-size:clamp(30px,6.5vmin,54px);background:linear-gradient(#f2fbff,#e3f5ef)}
.spot.found{animation:ring .6s}
@keyframes ring{0%{box-shadow:inset 0 0 0 0 #ff7b6b}50%{box-shadow:inset 0 0 0 8px #ff7b6b}}
.board{width:min(60vw,34vh,250px);aspect-ratio:1}
.board.done{animation:pop .6s;border-color:#3e9b62}
.cell{min-width:0;min-height:0;background:white;border:1px dashed #9aa799;transition:background .2s}
.cell svg{opacity:.18}
.cell.active{outline:4px dashed #e08a2e;outline-offset:-6px;background:#fff6dc}
.cell.over{background:#ffe9ac}
.cell.placed svg{opacity:1;animation:pop .35s}
.piece{width:clamp(60px,16vw,92px);aspect-ratio:1;padding:0;overflow:hidden;touch-action:none}
.cell svg,.piece svg{width:100%;height:100%;display:block;pointer-events:none}
.ghost{position:fixed;z-index:20;pointer-events:none;width:90px;height:90px;border-radius:14px;overflow:hidden;border:3px solid #e08a2e;
  box-shadow:0 14px 26px #0004;transform:translate(-50%,-50%) rotate(-6deg) scale(1.08)}
.ghost svg{width:100%;height:100%;display:block}
.pond{position:relative;display:flex;align-items:center;width:min(100%,560px);justify-content:center;gap:6px;
  background:radial-gradient(ellipse at 50% 30%,#bdeef0,#7fcfd6);padding:38px 8px 16px;border-radius:30px;border:3px solid #5fb2b8}
.bank{font-size:32px;flex:0 0 auto}
.pad{position:relative;flex:1;max-width:78px;aspect-ratio:1;padding:0;border-radius:50% 50% 50% 8%;font-weight:800;font-size:22px;
  background:radial-gradient(circle at 40% 35%,#dff7a0,#7cc46f);border-color:#3f8a4a;box-shadow:0 4px 0 #3d7f49,0 8px 12px #0003}
.pad.done{filter:saturate(1.4) brightness(1.05)}
.goal{position:absolute;top:-14px;right:-6px;font-size:22px}
.frog{position:absolute;top:-2px;left:0;font-size:34px;transform:translateX(-50%);transition:left .38s ease-in-out;pointer-events:none;z-index:2}
.frog.jump{animation:frogJump .38s ease-in-out}
@keyframes frogJump{50%{transform:translate(-50%,-34px) scale(1.15)}}
.drops{font-size:24px;letter-spacing:4px}
.drops span{display:inline-block;transition:opacity .3s,transform .3s}
.drops span.off{opacity:.2;transform:scale(.6)}
.map,.movie{width:min(100%,700px);border-radius:22px;overflow:hidden;border:4px solid #578c89;background:#b9e8e4}
.map{display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}
.movie{position:relative;aspect-ratio:2.2;min-height:150px;background:linear-gradient(#a7dfec,#ecf9e9 55%,#86d5ce 56%,#3a99aa)}
.movie .land{position:absolute;bottom:15%;right:7%;font-size:clamp(50px,9vw,100px);filter:drop-shadow(0 6px 2px #365b5c55);animation:float 3s ease-in-out infinite}
.movie .actor{position:absolute;bottom:12%;left:5%;font-size:clamp(40px,7vw,76px)}

/* ---------- Pudelipost ---------- */

/* ---------- Aardelaegas ---------- */
.rating{font-size:clamp(40px,8vw,64px);letter-spacing:6px;min-height:1.2em}

.loot{position:absolute;left:50%;bottom:90px;font-size:34px;pointer-events:none}
.newsticker{display:inline-grid;justify-items:center;gap:2px;background:#fff;border:4px dashed #e08a2e;border-radius:22px;padding:10px 22px;animation:flipIn .8s backwards .4s}

/* ---------- Kleebiseraamat ---------- */
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px;width:100%}

.isle .badge{position:absolute;top:-12px;right:-10px;font-size:24px}
.chart .shipmark{position:absolute;font-size:clamp(28px,4.5vw,42px);transform:translate(-50%,-50%);transition:left 1s,top 1s;animation:float 2.4s ease-in-out infinite;pointer-events:none}

.voywrap canvas{display:block;width:100%;height:100%;cursor:ns-resize}
.helm{min-width:70px;font-size:26px}
.islandscene{position:relative;width:min(100%,760px);aspect-ratio:16/10;border-radius:28px;overflow:hidden;border:5px solid #0d5f6e;margin:auto;

.islandscene.dive{background:radial-gradient(ellipse 80% 30% at 50% 100%,var(--g) 0 70%,transparent 72%),radial-gradient(ellipse 50% 12% at 30% 0%,#ffffff33,transparent),linear-gradient(var(--s1),var(--s2))}

.xspot{position:absolute;transform:translate(-50%,-50%);width:clamp(70px,12vw,100px);aspect-ratio:1;border-radius:50%;padding:0;font-size:clamp(40px,7vw,60px);font-weight:800;color:#c0301e;
  background:#ffffff66;border:4px dashed #c0301e;box-shadow:none}
.xspot.locked{opacity:.45;filter:grayscale(.6)}
.xspot.ready{background:#fff3c4;animation:glow 1.1s ease-in-out infinite}
.pieces{display:flex;gap:8px;justify-content:center;align-items:center;font-size:16px}
.pieces span{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:12px;border:3px dashed #c4a46b;font-size:30px;background:#fff8e6}

.diggrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:min(100%,560px);padding:12px;border-radius:24px}
.diggrid.sand{background:linear-gradient(#f6dfa6,#e9c77f);border:4px solid #c49a52}
.diggrid.sea{background:linear-gradient(#5aa9cf,#2e6f99);border:4px solid #1f5378}
.diggrid.snow{background:linear-gradient(#f4fbff,#cfe4f3);border:4px solid #8fb6d3}
.dt{aspect-ratio:1;min-height:0;padding:0;border-radius:14px;font-size:clamp(22px,5vw,34px);border:2px solid #c49a52;box-shadow:0 4px 0 #b88a45;
  background:radial-gradient(circle at 30% 30%,#ffe9b3 0 2px,transparent 3px) 0 0/12px 12px,linear-gradient(#f9e2a8,#efce86)}
.sea .dt{border-color:#1f5378;box-shadow:0 4px 0 #1b4a6c;background:radial-gradient(circle at 30% 30%,#9fd2ea 0 2px,transparent 3px) 0 0/12px 12px,linear-gradient(#e7d39b,#cdb274)}
.snow .dt{border-color:#8fb6d3;box-shadow:0 4px 0 #7aa2c0;background:radial-gradient(circle at 30% 30%,#fff 0 2px,transparent 3px) 0 0/12px 12px,linear-gradient(#ffffff,#e3f0fa)}
.dt.dug{background:radial-gradient(circle,#8a6233 0 40%,#a77a43 70%);box-shadow:inset 0 6px 10px #0006;transform:none!important}
.sea .dt.dug{background:radial-gradient(circle,#4c5f6b 0 40%,#6c7f88 70%)}
.snow .dt.dug{background:radial-gradient(circle,#9cb7cc 0 40%,#c4d9e8 70%)}
.dt.hot{outline:4px solid #ff4d2e;outline-offset:-4px}
.dt.warm{outline:4px solid #ffb627;outline-offset:-4px}
.dt.cold{outline:4px solid #6fb7ff;outline-offset:-4px}

/* ---------- Videod ---------- */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;width:100%}
.vcard{padding:0;overflow:hidden;display:grid;text-align:left;border-radius:18px}
.vcard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#cde}
.vcard span{padding:6px 10px;font-size:15px;font-weight:800}
.vsearch button{font-size:17px}
.vmodal{position:fixed;inset:0;z-index:40;background:#062a35dd;display:grid;place-items:center;padding:16px;animation:popIn .3s}
.vmodal .vbox{width:min(100%,960px);display:grid;gap:10px}
.vmodal iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:18px;background:#000;box-shadow:0 20px 40px #0008}
.parentbox{display:grid;gap:10px;justify-items:center;width:100%;padding:14px;border-radius:18px;background:#f1f7f6;border:2px dashed #8fb9b2}
.parentbox input{width:min(100%,420px);padding:10px 12px;border-radius:12px;border:2px solid #8fb9b2;background:#fff}
.vlist{display:grid;gap:6px;width:min(100%,520px)}
.vlist div{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:4px 4px 4px 12px;font-size:15px;text-align:left}

/* ---------- Efektid ---------- */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.flystar{position:fixed;z-index:31;font-size:30px;pointer-events:none}
.splash{position:fixed;z-index:4;pointer-events:none;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:3px solid #fff;animation:ripple .7s ease-out forwards}
@keyframes ripple{to{transform:scale(7);opacity:0}}
.jumper{position:fixed;z-index:4;pointer-events:none;font-size:30px}

@media(max-width:480px){
  body{font-size:17px}
  .menu{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .menu button{min-height:116px}
  .slots{gap:4px}.tools{gap:5px}
  .bar .progress{order:3;max-width:none;flex-basis:100%}
  .feature{grid-template-columns:1fr;padding:16px}
  .feature .fisland{position:absolute;right:8px;top:6px;font-size:54px}
  .isle{min-width:76px;font-size:12px;padding:4px 6px}
  .pin{min-width:70px;font-size:11px;padding:3px 6px}
  .chart{aspect-ratio:4/5}
  .islandscene{aspect-ratio:4/5}
  .diggrid{gap:4px;padding:8px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .movie.play .actor{left:55%}
  .fishy{left:auto!important;position:relative}
  .bub{position:relative;bottom:auto}
  .bottle{left:42%}
}

function mix(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(items){return items[Math.floor(Math.random()*items.length)]}
function nextItems(key,pool,count){
  let bag=bags.get(key)||[];const result=[];
  while(result.length<count){
    if(!bag.length)bag=[...mix(pool.filter(x=>result.includes(x))),...mix(pool.filter(x=>!result.includes(x)))];
    result.push(bag.pop());
  }
  bags.set(key,bag);return result;
}
function later(fn,ms){const id=setTimeout(()=>{timers.delete(id);fn()},ms);timers.add(id)}

function tone(hz=480,delay=0,type='sine',dur=.18,vol=.07){
  if(!sound||!audio||audio.state!=='running')return;
  const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();
  o.frequency.value=hz;o.type=type;
  g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+dur+.02);
  o.onended=()=>{o.disconnect();g.disconnect()};
}
function chord(){[523,659,784,1047].forEach((h,i)=>tone(h,i*.08,'triangle',.3,.06))}
function fanfare(){[523,523,659,784,659,784,1047].forEach((h,i)=>tone(h,i*.13,'triangle',.25,.07))}

function sweep(f1,f2,dur=.18,vol=.08,type='sine'){
  if(!sound||!audio||audio.state!=='running')return;
  const t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur+.02);
  o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+dur+.05);
}
function plop(){sweep(700+Math.random()*300,160,.15)}

function speak(text){

  const v=speechSynthesis.getVoices().find(v=>/^et(?:[-_]|$)/i.test(v.lang));
  if(!v)return false;
  speechSynthesis.cancel();
  const line=new SpeechSynthesisUtterance(text);line.voice=v;line.lang='et-EE';line.rate=.84;
  speechSynthesis.speak(line);return true;
}

/* ---------- Konfetti ---------- */
const fx=get('fx'),ctx=fx.getContext('2d');let parts=[],fxRun=false;
function sizeFx(){const d=devicePixelRatio||1;fx.width=innerWidth*d;fx.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0)}
function confetti(x=innerWidth/2,y=innerHeight*.4,n=70){
  if(reduced())return;
  const cols=['#ff7b6b','#ffd25e','#45b37a','#36b8d6','#b05bd6','#ff9fd1'];
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=3+Math.random()*8;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,r:6+Math.random()*6,c:pick(cols),rot:Math.random()*6,vr:(Math.random()-.5)*.4,life:80+Math.random()*50,round:Math.random()<.3});
  }
  if(!fxRun){fxRun=true;requestAnimationFrame(tick)}
}
function tick(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life-->0&&p.y<innerHeight+30);
  for(const p of parts){
    p.vy+=.22;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
    ctx.save();ctx.globalAlpha=Math.min(1,p.life/25);ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;
    if(p.round){ctx.beginPath();ctx.arc(0,0,p.r*.45,0,7);ctx.fill()}else ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);
    ctx.restore();
  }
  if(parts.length)requestAnimationFrame(tick);else{fxRun=false;ctx.clearRect(0,0,innerWidth,innerHeight)}
}
function flyStars(n,from){
  const to=get('starCount'),chip=to&&to.parentElement;
  const a=from?center(from):{x:innerWidth/2,y:innerHeight/2};
  const b=to?center(to):{x:innerWidth-40,y:30};
  for(let i=0;i<n;i++){
    const s=document.createElement('span');s.className='flystar';s.textContent='⭐';
    s.style.left=a.x+'px';s.style.top=a.y+'px';document.body.append(s);
    const dx=b.x-a.x,dy=b.y-a.y;
    const anim=s.animate([
      {transform:'translate(-50%,-50%) scale(.5)'},
      {transform:`translate(calc(-50% + ${dx*.3}px),calc(-50% + ${dy*.3-90}px)) scale(1.7)`,offset:.45},
      {transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(.8)`}
    ],{duration:reduced()?1:800,delay:i*150,easing:'cubic-bezier(.45,0,.55,1)',fill:'backwards'});
    anim.onfinish=()=>{
      s.remove();tone(880+i*80,0,'sine',.1,.05);
      if(to){to.textContent=Math.min(stars,Number(to.textContent)+1);chip.classList.remove('bump');void chip.offsetWidth;chip.classList.add('bump')}
    };
  }
  if(to)later(()=>{to.textContent=stars},n*150+900);
}
function jumper(x,y,emoji,dx=(Math.random()-.5)*160,up=90,fall=0){

}

const sl=get('seaLife'),sc=sl.getContext('2d');
let fishes=[],trail=[],ptr={x:-999,y:-999,t:0},lastTrail={x:0,y:0};
function sizeSL(){const d=devicePixelRatio||1;sl.width=innerWidth*d;sl.height=innerHeight*d;sc.setTransform(d,0,0,d,0,0)}
const seaBand=()=>[innerHeight*.58,innerHeight*.75];
function makeFish(){const [a,b]=seaBand(),dir=Math.random()<.5?-1:1;
  return{x:Math.random()*innerWidth,y:a+Math.random()*(b-a),vx:dir*(.4+Math.random()*.8),cruise:.4+Math.random()*.8,e:pick(['🐟','🐠','🐡','🐟','🐠','🐬']),s:22+Math.random()*16,ph:Math.random()*6,jump:0,vy:0,base:0,rot:0}}
function fishJumpAt(x,y){
  let best=null,bd=80;
  for(const f of fishes){const d=Math.hypot(f.x-x,f.y-y);if(!f.jump&&d<bd){bd=d;best=f}}
  if(!best)return false;
  best.jump=1;best.base=best.y;best.vy=-10;plop();return true;
}
function slTick(){
  requestAnimationFrame(slTick);
  if(document.hidden)return;
  sc.clearRect(0,0,innerWidth,innerHeight);
  const [a,b]=seaBand(),now=performance.now();
  for(const f of fishes){
    if(f.jump){
      f.vy+=.38;f.y+=f.vy;f.x+=f.vx*1.6;f.rot+=.16*Math.sign(f.vx||1);
      if(f.vy>0&&f.y>=f.base){f.y=f.base;f.jump=0;f.rot=0;trail.push({x:f.x,y:f.y,vx:0,vy:0,life:30,max:30,k:'ring'})}
    }else{
      const dx=f.x-ptr.x,dy=f.y-ptr.y,d=Math.hypot(dx,dy)||1;
      if(d<120&&now-ptr.t<1500){f.vx+=dx/d*.35;f.y+=dy/d*1.4}
      if(Math.abs(f.vx)>4)f.vx=Math.sign(f.vx)*4;
      if(Math.abs(f.vx)>f.cruise)f.vx*=.975;
      f.ph+=.05;f.x+=f.vx;f.y+=Math.sin(f.ph)*.35;f.y=Math.max(a,Math.min(b,f.y));
      if(f.x<-50)f.x=innerWidth+50;if(f.x>innerWidth+50)f.x=-50;
    }
    sc.save();sc.translate(f.x,f.y);sc.rotate(f.rot);if(f.vx>0)sc.scale(-1,1);
    sc.globalAlpha=f.jump?1:.85;sc.font=f.s+'px serif';sc.textAlign='center';sc.textBaseline='middle';sc.fillText(f.e,0,0);sc.restore();
  }
  trail=trail.filter(p=>p.life-->0);
  for(const p of trail){
    p.x+=p.vx;p.y+=p.vy;const al=p.life/p.max;sc.globalAlpha=al;
    if(p.k==='spark'){sc.fillStyle='#ffe066';sc.save();sc.translate(p.x,p.y);sc.rotate(p.life*.1);const r=3+4*al;
      sc.beginPath();for(let i=0;i<8;i++){const rr=i%2?r*.35:r,an=i*Math.PI/4;sc.lineTo(Math.cos(an)*rr,Math.sin(an)*rr)}sc.fill();sc.restore()}
    else if(p.k==='bub'){sc.strokeStyle='#fff';sc.lineWidth=1.6;sc.beginPath();sc.arc(p.x,p.y,2+5*(1-al),0,7);sc.stroke()}
    else if(p.k==='ring'){sc.strokeStyle='#fff';sc.lineWidth=2;sc.beginPath();sc.ellipse(p.x,p.y,30*(1-al)+4,8*(1-al)+2,0,0,7);sc.stroke()}
    else{sc.fillStyle='#c79a52';sc.beginPath();sc.arc(p.x,p.y,2,0,7);sc.fill()}
  }
  sc.globalAlpha=1;
}
let pmRaf=0;
document.addEventListener('pointermove',e=>{
  ptr={x:e.clientX,y:e.clientY,t:performance.now()};

    lookAt(ptr.x,ptr.y);
  });
  if(reduced()||Math.hypot(e.clientX-lastTrail.x,e.clientY-lastTrail.y)<14)return;
  lastTrail={x:e.clientX,y:e.clientY};
  const h=e.clientY/innerHeight;
  if(h<.52)trail.push({x:e.clientX,y:e.clientY,vx:(Math.random()-.5),vy:.4,life:40,max:40,k:'spark'});
  else if(h<.78)trail.push({x:e.clientX,y:e.clientY,vx:(Math.random()-.5)*.6,vy:-1.1,life:50,max:50,k:'bub'});
  else trail.push({x:e.clientX,y:e.clientY,vx:(Math.random()-.5)*1.5,vy:-.6,life:22,max:22,k:'sand'});
  if(trail.length>160)trail.splice(0,trail.length-160);
});
function hitEl(sel,x,y){return [...document.querySelectorAll(sel)].find(el=>{const r=el.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom})}

  if(e.target.closest('button,select,input,a,svg,canvas,.panel,label,.seg,.chip,.progress,.vmodal,.feature'))return;

  const sun=hitEl('.sun',x,y);
  if(sun){sun.classList.remove('whee');void sun.offsetWidth;sun.classList.add('whee');setNight(!night);return}
  const cloud=hitEl('.cloud',x,y);
  if(cloud){const r=cloud.getBoundingClientRect();for(let i=0;i<9;i++)setTimeout(()=>jumper(r.left+r.width*(.2+Math.random()*.6),r.top+r.height*.7,'💧',(Math.random()-.5)*20,-10,220),i*90);
    tone(1200,0,'sine',.08,.03);tone(1500,.1,'sine',.08,.03);say('Vihma sajab! 🌧️','happy');return}
  const boat=hitEl('.boat',x,y);

function choose(correct,pool,render,label,instruction){

/* ---------- Lao sõna ---------- */
function flyLetter(c,from,to){
  const a=center(from),t=center(to);
  const f=document.createElement('span');f.className='flystar';f.textContent=c;f.style.cssText+='font-weight:800;font-size:34px;color:#0f6b74;left:'+a.x+'px;top:'+a.y+'px';

function spellGame(x){
  let cursor=0;const letters=[...x.word];
  get('stage').innerHTML='<div class="sample">'+x.icon+'</div><div class="slots" id="slots"></div><div class="row" id="tiles"></div>';
  for(const c of letters){const s=document.createElement('span');s.className='slot';s.textContent=c;get('slots').append(s)}
  const slots=get('slots').children;slots[0].classList.add('next');
  const tiles=[];
  mix(letters).forEach((c,i)=>{
    const b=btn(get('tiles'),'Täht '+c,c,b=>{
      if(locked||b.disabled)return;
      if(c!==letters[cursor]){fail(b,'Otsi tähte '+letters[cursor]+'.');return}
      const slot=slots[cursor];b.disabled=true;flyLetter(c,b,slot);b.classList.add('used');
      slot.className='slot filled';tone(440+cursor*45,0,'triangle');stepOk();
      if(++cursor===letters.length){speak(x.word.toLowerCase());win();return}
      slots[cursor].classList.add('next');voiceText='Leia täht '+letters[cursor]+'.';status(voiceText);
    },'tile');
    b.style.setProperty('--d',i);tiles.push([c,b]);
  });
  hint=()=>{const t=tiles.find(([c,b])=>c===letters[cursor]&&!b.disabled);return t&&t[1]};
  tell('Lao sõna '+x.word.toLowerCase()+'. Leia täht '+letters[0]+'.');
}

/* ---------- UUS: Sõnapüük ---------- */
function fishGame(x){
  const n=round<2?3:4;

  const fp=get('fp');let good;
  opts.forEach((w,i)=>{
    const ltr=i%2===1,dur=Math.max(6,10+Math.random()*3-round*.25);

      if(locked)return;

/* ---------- UUS: Mullipauk ---------- */
function bubbleGame(x0){
  const max=round<4?5:7;let x=x0;
  if(x.word.length>max)x=pick(words.filter(w=>w.word.length<=max));

  for(const c of letters){const s=document.createElement('span');s.className='slot hidden';s.textContent=c;get('slots').append(s)}
  const slots=get('slots').children;slots[0].classList.add('next');
  const tank=get('tank');
  const extra=mix(alphabet.filter(c=>!letters.includes(c))).slice(0,round<3?2:4);
  const all=mix([...letters,...extra]);
  all.forEach((c,i)=>{
    const dur=7+Math.random()*3;
    const b=btn(tank,'Mull tähega '+c,'<span>'+c+'</span>',b=>{
      if(locked)return;
      if(c!==letters[cursor]){const s=b.firstChild;s.classList.remove('nope');void s.offsetWidth;s.classList.add('nope');fail(null,'Otsi mulli tähega '+letters[cursor]+'.');return}
      const r=b.getBoundingClientRect(),tr=tank.getBoundingClientRect();
      const bu=document.createElement('span');bu.className='burst';bu.style.left=(r.left-tr.left+r.width/2)+'px';bu.style.top=(r.top-tr.top+r.height/2)+'px';tank.append(bu);setTimeout(()=>bu.remove(),460);
      flyLetter(c,b,slots[cursor]);b.remove();pop();
      slots[cursor].className='slot filled';stepOk();
      if(++cursor===letters.length){speak(x.word.toLowerCase());win(slots[cursor-1]);return}
      slots[cursor].classList.add('next');voiceText='Otsi täht '+letters[cursor]+'.';status(voiceText);
    },'bub');
    b.style.left=(4+((i*37)%84))+'%';b.style.animationDuration=dur+'s';b.style.animationDelay=(-Math.random()*dur)+'s';
  });
  hint=()=>{const b=[...tank.querySelectorAll('.bub')].find(b=>b.textContent===letters[cursor]);return b&&b.firstChild};
  tell('Paugu mullid sõna järjekorras. '+x.word.toLowerCase()+'. Esimene täht on '+letters[0]+'.');

/* ---------- UUS: Pudelipost ---------- */
function bottleGame(x){
  const L=[...x.word];
  const count=Math.min(round<4?1:2,L.length-1);
  const holes=mix(L.map((_,i)=>i)).slice(0,count).sort((a,b)=>a-b);
  let h=0;
  get('stage').innerHTML='<p style="font-size:20px">🍾 Merelt tuli pudelipost! Puuduta pudelit.</p><div class="bottlesea" id="bs"></div>';
  btn(get('bs'),'Ava pudel','🍾',()=>{
    pop();tone(700,.1,'triangle');
    get('stage').innerHTML='<div class="scroll"><div class="sample" style="font-size:clamp(50px,10vmin,84px)">'+x.icon+'</div><div class="slots" id="slots"></div></div><div class="row" id="options"></div>';
    L.forEach((c,i)=>{const s=document.createElement('span');s.className='slot'+(holes.includes(i)?' hidden':' filled');s.textContent=c;get('slots').append(s)});
    ask();
  },'bottle');
  tell('Merelt tuli pudelipost. Puuduta pudelit.');
  function ask(){
    const slots=get('slots').children,pos=holes[h],correct=L[pos];
    slots[pos].classList.add('next');
    get('options').replaceChildren();
    const n=round<2?3:4;let good;
    mix([correct,...mix(alphabet.filter(c=>c!==correct)).slice(0,n-1)]).forEach((c,i)=>{
      const b=btn(get('options'),'Täht '+c,c,b=>{

        if(++h===holes.length){speak(x.word.toLowerCase());win(b);return}
        ask();
      },'card');
      b.style.setProperty('--d',i);if(c===correct)good=b;
    });

function crop(x,i){

  return '<svg aria-hidden="true" viewBox="'+boxes[i]+'"><rect width="100" height="100" fill="#c6eae9"/>'+
    '<circle cx="18" cy="16" r="10" fill="#ffcf67"/><path d="M0 66Q32 48 56 66T100 62V100H0Z" fill="#91cdaa"/>'+
    '<path d="M0 88Q40 67 100 88V100H0Z" fill="#f3d09a"/>'+
    '<text x="50" y="73" text-anchor="middle" font-size="68">'+x.icon+'</text></svg>';
}
function puzzleGame(x){
  const order=round<2?[0,1,2,3]:mix([0,1,2,3]),placed=new Set(),pieces={};
  const labels=['ülemine vasak','ülemine parem','alumine vasak','alumine parem'];
  get('stage').innerHTML='<div id="board" class="board"></div><div class="row" id="pieces"></div>';
  for(let i=0;i<4;i++)get('board').insertAdjacentHTML('beforeend','<div class="cell">'+crop(x,i)+'</div>');
  const cells=[...get('board').children];
  const active=()=>order.find(i=>!placed.has(i));
  const paint=()=>cells.forEach((c,i)=>c.classList.toggle('active',i===active()));
  function place(i,b){
    placed.add(i);cells[i].classList.add('placed');b.classList.add('used');b.disabled=true;
    tone(460+placed.size*60,0,'triangle');stepOk(cells[i]);
    if(placed.size===4){cells.forEach(c=>c.classList.remove('active'));get('board').classList.add('done');win();return}
    paint();
  }
  let dragged=false;
  for(const i of mix([0,1,2,3])){
    const b=btn(get('pieces'),labels[i]+' tükk',crop(x,i),()=>{
      if(locked||dragged)return;
      if(i!==active()){fail(b,'Vaata punktiiriga ruutu – või lohista tükk õigesse kohta.');return}
      place(i,b);
    },'piece');
    pieces[i]=b;
    let st=null,ghost=null,over=null;
    b.addEventListener('pointerdown',e=>{if(locked||b.disabled)return;st={x:e.clientX,y:e.clientY,id:e.pointerId};dragged=false});
    b.addEventListener('pointermove',e=>{
      if(!st||e.pointerId!==st.id)return;
      if(!ghost&&Math.hypot(e.clientX-st.x,e.clientY-st.y)>8){
        dragged=true;try{b.setPointerCapture(e.pointerId)}catch{}
        ghost=document.createElement('div');ghost.className='ghost';ghost.innerHTML=crop(x,i);document.body.append(ghost);b.style.opacity=.3;
      }
      if(ghost){
        ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';
        const c=document.elementFromPoint(e.clientX,e.clientY)?.closest('.cell');
        if(over&&over!==c)over.classList.remove('over');over=c;if(c)c.classList.add('over');
      }
    });
    const end=e=>{
      if(!st||e.pointerId!==st.id)return;st=null;
      if(ghost){
        ghost.remove();ghost=null;b.style.opacity='';
        if(over){over.classList.remove('over');const k=cells.indexOf(over);
          if(k===i&&!placed.has(i))place(i,b);else fail(b,'See tükk ei sobi sinna.');}
        over=null;setTimeout(()=>dragged=false,50);
      }
    };
    b.addEventListener('pointerup',end);b.addEventListener('pointercancel',end);
  }
  paint();hint=()=>pieces[active()];
  tell('Pane tükk märgitud kohta. Võid tükke ka lohistada.');
}

/* ---------- Leia erinevused ---------- */
function diffGame(x){
  const pool=mix(words.filter(a=>a!==x));
  const left=mix([x,...pool.slice(0,3)]),right=[...left];
  const changed=mix([0,1,2,3]).slice(0,round<3?1:2),found=new Set();
  changed.forEach((v,i)=>right[v]=pool[i+3]);
  const task=changed.length===1?'Leia üks erinevus.':'Leia kaks erinevust.';
  get('stage').innerHTML='<p style="font-size:20px">🔎 '+task+'</p><div class="pair"><div class="picture" id="left"></div><div class="picture" id="right"></div></div>';
  for(const [side,list] of [['left',left],['right',right]]){
    list.forEach((v,i)=>btn(get(side),v.word,v.icon,b=>{
      if(locked||found.has(i))return;
      if(!changed.includes(i)){fail(b,'Need pildid on ühesugused.');return}
      found.add(i);for(const s of ['left','right'])get(s).children[i].classList.add('found');
      if(found.size===changed.length)win(b);else{tone(620,0,'triangle');stepOk(b);status('Üks erinevus veel!')}
    },'spot'));
  }
  hint=()=>{const i=changed.find(k=>!found.has(k));return i==null?null:get('right').children[i]};
  tell(task);
}

  const moveTo=el=>{
    const c=el.offsetLeft+el.offsetWidth/2;frog.style.left=(c/pond.clientWidth*100)+'%';
    frog.classList.remove('jump');void frog.offsetWidth;frog.classList.add('jump');

function memoryGame(x){

  const seq=[];for(let i=0;i<length;i++)seq.push(pick([0,1,2].filter(j=>j!==seq[i-1])));
  let step=0,playing=false;
  get('stage').innerHTML='<p id="memHint" style="font-size:20px"></p><div class="row" id="cards"></div><div id="repeat"></div>';
  const notes=[440,554,659];

    tone(notes[i],0,'triangle');b.classList.add('lit');later(()=>b.classList.remove('lit'),250);

  }

function mapGame(){
  const flip=Math.random()<.5;
  const spots=[[68,165],[182,81],[305,149],[438,65],[540,142]].map(([x,y])=>({x:flip?600-x:x,y:y+Math.floor(Math.random()*31)-15}));
  const stops=round<3?[spots[0],spots[2],spots[4]]:spots;
  const ns='http://www.w3.org/2000/svg';
  let index=0,active=null,line=null,color='#9a442c',free=false,hue=0,count=0,last=null;
  get('stage').innerHTML='<p id="mapHint" style="font-size:20px"></p><svg class="map" id="mapPaper" viewBox="0 0 600 240" aria-label="Joonistatav aardekaart">'+
    '<defs><pattern id="ripples" width="40" height="20" patternUnits="userSpaceOnUse"><path d="M0 10Q10 4 20 10T40 10" fill="none" stroke="#ffffff55" stroke-width="2"/></pattern></defs>'+
    '<rect width="600" height="240" fill="#99dce0"/><rect width="600" height="240" fill="url(#ripples)"/>'+
    '<path d="M8 135Q33 40 158 51T369 41Q489 2 577 71Q628 151 532 186T306 203Q183 228 79 209Q12 205 8 135Z" fill="#69a99b"/>'+
    '<path d="M8 125Q33 30 158 41T369 31Q489 -8 577 61Q628 141 532 176T306 193Q183 218 79 199Q12 195 8 125Z" fill="#f2dfa4"/>'+
    '<text x="26" y="40" font-size="26">🧭</text><text x="275" y="72" font-size="35">🌴</text>'+
    '<text x="374" y="195" font-size="26">🪨</text><text x="110" y="222" font-size="25">🐟</text><text x="545" y="228" font-size="22">🐙</text>'+
    '<g id="guide"></g><g id="ink"></g><g id="marks" pointer-events="none"></g></svg><div class="row" id="paintTools"></div>';
  const paper=get('mapPaper');
  function svg(tag,attrs){const n=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);return n}
  function mark(){
    get('marks').replaceChildren();get('guide').replaceChildren();
    if(free){get('mapHint').textContent='🎨 Joonista oma saar või meretee.';return}
    get('mapHint').textContent=index===0?'Alusta lipust ja tõmba joon mööda täppe.':'Jätka helendava märgini.';
    get('guide').append(svg('polyline',{points:stops.map(p=>p.x+','+p.y).join(' '),fill:'none',stroke:'#9a8358','stroke-width':3,'stroke-dasharray':'4 9'}));
    stops.forEach((p,i)=>{
      if(i===index){const halo=svg('circle',{cx:p.x,cy:p.y,r:20,fill:'none',stroke:'#ffb627','stroke-width':4});
        halo.innerHTML='<animate attributeName="r" values="20;30;20" dur="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>';
        get('marks').append(halo)}
      get('marks').append(svg('circle',{cx:p.x,cy:p.y,r:i===index?20:14,fill:i<index?'#b8e3ab':'#fff9de',stroke:i===index?'#b85d19':'#65897b','stroke-width':i===index?5:2}));
      const t=svg('text',{x:p.x,y:p.y+7,'text-anchor':'middle','font-size':19});
      t.textContent=i===0?'⚑':i===stops.length-1?'💎':i<index?'✓':'•';get('marks').append(t);
    });
  }
  function coords(e){const p=paper.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(paper.getScreenCTM().inverse())}
  const distance=(p,q)=>Math.hypot(p.x-q.x,p.y-q.y);
  function reset(){
    if(active!==null&&paper.hasPointerCapture(active))paper.releasePointerCapture(active);
    active=null;line=null;index=0;get('ink').replaceChildren();mark();status('');
  }
  function stroke(p){
    const c=color==='rainbow'?`hsl(${hue=(hue+28)%360} 85% 52%)`:color;
    line=svg('polyline',{points:p.x.toFixed(1)+','+p.y.toFixed(1),fill:'none',stroke:c,'stroke-width':free?6:7,'stroke-linecap':'round','stroke-linejoin':'round'});
    get('ink').append(line);last=p;
  }
  paper.onpointerdown=e=>{
    if(locked||active!==null||e.button!==0)return;
    const p=coords(e);
    if(!free&&distance(p,stops[Math.max(0,index-1)])>34){status(index?'Jätka viimasest läbitud märgist.':'Pane sõrm lipule ⚑.');return}
    unlock();e.preventDefault();active=e.pointerId;try{paper.setPointerCapture(active)}catch{}stroke(p);
    if(!free&&index===0){index=1;mark();tone(410,0,'triangle')}
  };
  paper.onpointermove=e=>{
    if(e.pointerId!==active||locked||!line)return;
    const p=coords(e);
    if(color==='rainbow'&&++count%6===0)stroke(last);
    line.setAttribute('points',line.getAttribute('points')+' '+p.x.toFixed(1)+','+p.y.toFixed(1));last=p;
    if(!free&&index<stops.length&&distance(p,stops[index])<28){
      index++;tone(400+index*70,0,'triangle');mark();
      if(index===stops.length){status('💎 Aare leitud!');const r=paper.getBoundingClientRect(),s=stops[stops.length-1];
        confetti(r.left+s.x/600*r.width,r.top+s.y/240*r.height,40);win()}
    }
  };
  const end=e=>{if(e.pointerId!==active)return;active=null;line=null};
  paper.onpointerup=end;paper.onpointercancel=end;paper.onlostpointercapture=end;
  for(const [name,icon,value] of [['Pruun','🟤','#9a442c'],['Sinine','🔵','#225baf'],['Roheline','🟢','#27794b'],['Vikerkaar','🌈','rainbow']]){
    const b=btn(get('paintTools'),name,icon,()=>{color=value;tone(700,0,'triangle',.08);get('paintTools').querySelectorAll('.swatch').forEach(n=>n.setAttribute('aria-pressed',String(n===b)))},'swatch');
    b.setAttribute('aria-pressed',String(value===color));
  }
  btn(get('paintTools'),'Kustuta jooned','↻ Puhasta',()=>{if(!locked)reset()},'small');
  btn(get('paintTools'),'Vaheta joonistamisviisi','🎨 Vaba joonistus',b=>{
    if(locked)return;free=!free;b.textContent=free?'🗺️ Aardetee':'🎨 Vaba joonistus';reset();
    tell(free?'Joonista sõrmega oma pilt.':'Alusta lipust ja leia aare.');
  },'small');
  mark();tell('Alusta lipust. Tõmba sõrmega joon mööda täppe aardeni.');
}

  tell('Juhi laeva. Kogu tähti ja hoia kividest eemale.');
  const cv=get('voy'),c=cv.getContext('2d'),W=800,H=400;
  function fit(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=Math.max(1,r.width*d);cv.height=Math.max(1,r.height*d);c.setTransform(cv.width/W,0,0,cv.height/H,0,0)}
  fit();
  const ship={x:150,y:260,ty:260};let items=[],t=0,prog=0,coins=0,slow=0,last=performance.now(),spawnT=1,arrived=false,shake=0,dir=0,wake=[];
  const dur=18+i*3,danger=.35+i*.07,minY=170,maxY=375;
  const clampY=y=>Math.max(minY,Math.min(maxY,y));
  const toLogical=e=>{const r=cv.getBoundingClientRect();return (e.clientY-r.top)/r.height*H};
  cv.onpointerdown=e=>{unlock();ship.ty=clampY(toLogical(e));try{cv.setPointerCapture(e.pointerId)}catch{}};
  cv.onpointermove=e=>{if(e.buttons||e.pointerType==='mouse')ship.ty=clampY(toLogical(e))};
  const kd=e=>{if(e.key==='ArrowUp'){dir=-1;e.preventDefault()}if(e.key==='ArrowDown'){dir=1;e.preventDefault()}};
  const ku=e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown')dir=0};
  addEventListener('keydown',kd);addEventListener('keyup',ku);addEventListener('resize',fit);
  for(const [lab,d] of [['▲',-1],['▼',1]]){
    const b=btn(get('helm'),d<0?'Üles':'Alla',lab,()=>{},'helm');
    b.onpointerdown=()=>{unlock();dir=d};b.onpointerup=b.onpointerleave=b.onpointercancel=()=>dir=0;
  }
  function emoji(e,x,y,s,rot=0,flip=false){c.save();c.translate(x,y);c.rotate(rot);if(flip)c.scale(-1,1);c.font=s+'px serif';c.textAlign='center';c.textBaseline='middle';c.fillText(e,0,0);c.restore()}
  function draw(){
    const g=c.createLinearGradient(0,0,0,150);g.addColorStop(0,isl.sky[0]);g.addColorStop(1,isl.sky[1]);c.fillStyle=g;c.fillRect(0,0,W,150);
    c.fillStyle=night?'#fffbe8':'#ffe27a';c.beginPath();c.arc(680,55,30,0,7);c.fill();
    for(let k=0;k<3;k++)emoji('☁️',((k*320-t*(14+k*6))%(W+200)+W+200)%(W+200)-100,30+k*28,40-k*6);
    const s=c.createLinearGradient(0,150,0,H);s.addColorStop(0,isl.s[0]);s.addColorStop(1,isl.s[1]);c.fillStyle=s;c.fillRect(0,150,W,H-150);
    if(prog>.78){const ix=W+140-(Math.min(prog,1.12)-.78)/.34*300;
      c.fillStyle=isl.shore;c.beginPath();c.ellipse(ix,168,150,26,0,0,7);c.fill();c.fillStyle=isl.g;c.beginPath();c.ellipse(ix,160,120,20,0,Math.PI,0);c.fill();
      emoji(isl.icon,ix,118,92);}
    for(let k=0;k<4;k++){
      c.fillStyle='rgba(255,255,255,'+(.10+k*.04)+')';c.beginPath();const y0=165+k*60,off=t*(50+k*25);
      c.moveTo(0,H);for(let x=0;x<=W;x+=20)c.lineTo(x,y0+Math.sin((x+off)/40+k)*6);c.lineTo(W,H);c.fill();
    }
    for(const it of items){
      if(it.k==='rock')emoji('🪨',it.x,it.y,50);
      else if(it.k==='star')emoji('⭐',it.x,it.y+Math.sin(t*5+it.x/50)*5,40,Math.sin(t*3)*.2);
      else if(it.k==='gift')emoji('🎁',it.x,it.y+Math.sin(t*4)*4,42);
      else emoji(it.e,it.x,it.y+Math.sin(t*3+it.x/30)*10,40);
    }
    for(const w of wake){c.fillStyle='rgba(255,255,255,'+(w.l/40)+')';c.beginPath();c.arc(w.x,w.y,3+(40-w.l)/6,0,7);c.fill()}
    const jx=shake>0?(Math.random()-.5)*10:0;
    emoji(isl.dive&&arrived?'🤿':'⛵',ship.x+jx,ship.y-18,76,Math.sin(t*3)*.08,true);
    c.fillStyle='#ffffffcc';c.beginPath();c.roundRect?c.roundRect(40,14,720,16,8):c.rect(40,14,720,16);c.fill();
    c.fillStyle='#2bb39a';c.beginPath();const pw=Math.max(16,720*Math.min(prog,1));c.roundRect?c.roundRect(40,14,pw,16,8):c.rect(40,14,pw,16);c.fill();
    emoji('⛵',40+720*Math.min(prog,1),22,24);emoji(isl.icon,768,22,26);
    c.fillStyle='#fff';c.strokeStyle='#0d5f6e';c.lineWidth=5;c.font='800 28px '+getComputedStyle(document.body).fontFamily;c.textAlign='left';c.textBaseline='middle';
    c.strokeText('⭐ '+coins,40,58);c.fillText('⭐ '+coins,40,58);
  }
  function frame(now){
    if(!cv.isConnected){removeEventListener('keydown',kd);removeEventListener('keyup',ku);removeEventListener('resize',fit);return}
    const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
    if(dir)ship.ty=clampY(ship.ty+dir*260*dt);
    ship.y+=(ship.ty-ship.y)*Math.min(1,dt*6);shake-=dt;
    if(Math.random()<.5)wake.push({x:ship.x-40,y:ship.y+14+(Math.random()-.5)*10,l:40});
    wake.forEach(w=>{w.x-=120*dt;w.l--});wake=wake.filter(w=>w.l>0);
    if(!arrived){
      const sp=slow>0?.6:1;slow-=dt;prog+=dt/dur*sp;spawnT-=dt*sp;
      if(spawnT<=0&&prog<.9){spawnT=.75+Math.random()*.6;
        const r=Math.random();items.push({x:W+40,y:minY+10+Math.random()*(maxY-minY-10),k:r<danger?'rock':r<danger+.42?'star':r<danger+.5?'gift':'fish',e:pick(['🐬','🐳','🐢','🦈'])})}
      for(const it of items){
        it.x-=230*sp*dt;
        if(!it.hit&&Math.hypot(it.x-ship.x,it.y-ship.y)<48){
          if(it.k==='rock'){it.hit=1;slow=1.2;shake=.4;boo();say('Oih, kivi!','think');status('Ettevaatust, kivid! 🪨')}
          else if(it.k==='star'){it.hit=1;coins++;tone(880+coins*20,0,'triangle',.12)}
          else if(it.k==='gift'){it.hit=1;coins+=3;chord();say('Kingitus! 🎁','happy')}
        }
      }
      items=items.filter(it=>it.x>-60&&!(it.hit&&it.k!=='rock'));
      items.forEach(it=>{if(it.hit&&it.k==='rock')it.x-=8});
      if(prog>=1.12){arrived=true;land()}
    }else{ship.x=Math.min(480,ship.x+140*dt);ship.ty=230}
    draw();requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  function land(){
    stars+=coins;saveStars();flyStars(Math.min(coins,8),cv);fanfare();
    const p=center(cv);confetti(p.x,p.y,120);buddy.classList.add('flip');
    say(isl.dive?'Sukeldume! 🤿':'Maa paistab! 🏝️','happy');
    status((isl.dive?'Jõudsid vrakini! ':'Jõudsid saarele '+isl.name+'! ')+'Kogusid '+coins+' tähte.');
    tell(isl.dive?'Jõudsid vana laevavraki juurde. Sukeldu!':'Maa paistab! Jõudsid saarele.');
    btn(get('helm'),'Edasi',isl.dive?'🤿 Sukeldu!':'🏝️ Mine kaldale',()=>islandMap(i));
  }
}

/* ---------- Saar ---------- */
function islandMap(i){
  cancel();mode='island';locked=false;
  if(advState.island!==i)advState={island:i,done:new Set()};
  const isl=islands[i],all=advState.done.size===isl.tasks.length;
  screen('Kaart',advHome,isl.icon+' '+isl.name);
  const pins=[[20,30],[78,28],[26,76]],decoPos=[[8,12],[92,10],[50,14],[90,84],[60,88]];
  get('stage').innerHTML='<div class="pieces" id="pieces">Kaarditükid: </div>'+
    '<div class="islandscene'+(isl.dive?' dive':'')+'" id="scene" style="--g:'+isl.g+';--shore:'+isl.shore+';--s1:'+isl.s[0]+';--s2:'+isl.s[1]+'"></div>';
  isl.tasks.forEach((_,k)=>{const s=document.createElement('span');s.textContent=advState.done.has(k)?'🧩':'';if(advState.done.has(k))s.className='got';get('pieces').append(s)});
  const scene=get('scene');
  isl.deco.concat(isl.deco[0]).forEach((d,k)=>{const s=document.createElement('span');s.className='deco';s.textContent=d;s.style.left=decoPos[k][0]+'%';s.style.top=decoPos[k][1]+'%';s.style.animationDelay=(k*.6)+'s';scene.append(s)});
  isl.tasks.forEach((task,k)=>{
    const done=advState.done.has(k);
    const b=btn(scene,task.n,'<span class="pi">'+task.i+'</span>'+task.n+(done?'<span class="badge">✅</span>':''),()=>{
      if(done){say('Siin oled juba käinud! ✅','happy');return}
      tone(600,0,'triangle');
      const item=nextItems('adv',words,1)[0];
      taskScreen(i,task,item,()=>{advState.done.add(k);islandMap(i);later(()=>{say('Leidsid kaarditüki! 🧩','happy');chord()},300)});
    },'pin'+(done?' done':' todo'));
    b.style.left=pins[k][0]+'%';b.style.top=pins[k][1]+'%';
  });
  const x=btn(scene,all?'Kaeva aare':'Aarde koht (lukus)','✖',b=>{
    if(!all){fail(b,'Kogu enne kõik kolm kaarditükki!');return}
    digGame(i);
  },'xspot'+(all?' ready':' locked'));
  x.style.left='64%';x.style.top='66%';
  if(all){status('🧩 Kaart on koos! Puuduta X-i ja kaeva aare välja!');tell('Kaart on koos! Puuduta risti ja kaeva aare välja!')}
  else{status('Lahenda saarel kolm ülesannet ja kogu kaarditükid. ('+advState.done.size+' / 3)');tell('Lahenda saarel kolm ülesannet ja kogu kaarditükid.')}
}
function taskScreen(i,task,item,done){
  cancel();locked=false;hint=null;missRound=0;mode='adv';advNext=done;game=task.k;
  round=2+i*2;
  screen('Saar',()=>islandMap(i),task.i+' '+task.n,'<span class="chip">'+games[task.k].i+' '+games[task.k].n+'</span>');
  games[task.k].f(item);
}

/* ---------- Aarde kaevamine ---------- */
function digGame(i){
  cancel();mode='dig';locked=false;
  const isl=islands[i],C=6,R=4,tx=Math.floor(Math.random()*C),ty=Math.floor(Math.random()*R);
  let digs=0,found=false;
  screen('Saar',()=>islandMap(i),(isl.dive?'🤿 Otsi merepõhjast!':'🪏 Kaeva aare välja!'));
  get('stage').innerHTML='<p class="clue" id="clue">Vali koht ja kaeva! Vihjed: ❄️ külm · ♨️ soe · 🔥 kuum</p><div class="diggrid '+isl.dig+'" id="grid"></div><div id="prize" class="stage"></div>';
  tell('Kaeva ja kuula vihjeid. Kuum tähendab, et aare on väga lähedal.');
  const junk={sand:['🐚','🦴','🪱','🦀','🪨','🥾','🍾','⭐'],sea:['🐚','🦀','🪸','🐌','⚓','🍾','🦐','⭐'],snow:['❄️','🧤','🐟','🪨','🧊','⛸️','🍾','⭐']}[isl.dig];
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){
    const b=btn(get('grid'),'Kaevamiskoht '+(r+1)+'-'+(c+1),'',b=>{
      if(found||b.classList.contains('dug'))return;
      digs++;b.classList.add('digging');sweep(220,90,.2,.09,'triangle');
      const sh=document.createElement('span');sh.className='shovel';sh.textContent=isl.dive?'🤿':'🪏';const p=center(b);sh.style.left=p.x+'px';sh.style.top=p.y+'px';document.body.append(sh);
      sh.animate([{transform:'translate(-30%,-80%) rotate(0)'},{transform:'translate(-30%,-60%) rotate(-30deg)'},{transform:'translate(-30%,-80%) rotate(0)'}],{duration:400}).onfinish=()=>sh.remove();
      for(let k=0;k<5;k++)jumper(p.x,p.y,isl.dig==='sea'?'🫧':isl.dig==='snow'?'❄️':'🟫',(Math.random()-.5)*90,40+Math.random()*30,10);
      setTimeout(()=>{
        b.classList.remove('digging');b.classList.add('dug');
        if(r===ty&&c===tx){found=true;b.textContent='🧰';b.classList.add('ok');treasureFound(b);return}
        const d=Math.max(Math.abs(r-ty),Math.abs(c-tx));
        const [cls,txt,hz]=d===1?['hot','🔥 Väga kuum! Aare on kõrval!',900]:d===2?['warm','♨️ Soe! Oled lähedal.',600]:['cold','❄️ Külm. Proovi mujalt.',300];
        b.classList.add(cls);b.textContent=Math.random()<.55?pick(junk):'';tone(hz,0,'triangle',.2);
        get('clue').textContent=txt;status('Kaevatud: '+digs);speak(txt.replace(/^[^ ]+ /,''));
        if(digs===6)say('Vaata, kus on kuum! 🔥','think');
      },380);
    },'dt');
  }
  function treasureFound(b){
    const p=center(b);confetti(p.x,p.y,90);fanfare();buddy.classList.add('flip');say('AARE! 💎','happy');
    get('clue').textContent='🎉 Leidsid aarde '+digs+'. kaevamisega!';
    later(()=>{
      get('grid').style.display='none';
      const prize=get('prize');prize.innerHTML='<div class="chestwrap" id="cw"></div><p id="reward" style="font-size:20px">Puuduta laegast!</p><div id="sticker"></div><div class="row" id="go"></div>';
      tell('Puuduta aardelaegast!');
      chestButton(get('cw'),b=>{
        const gain=5+(digs<=4?3:0)+i*2;stars+=gain;saveStars();flyStars(Math.min(gain,10),b);
        const first=!advDone.has(i);advDone.add(i);store.set('advDone',[...advDone]);advState={island:-1,done:new Set()};
        get('reward').innerHTML='<b style="font-size:42px">'+isl.treasure+'</b><br>Saare aare on sinu! +'+gain+' tähte'+(digs<=4?' (kiire leidja boonus!)':'');
        const st=awardSticker(get('sticker'));
        tell('Saare aare on sinu! '+st);
        const nx=i+1<islands.length?i+1:-1;
        if(nx>=0)btn(get('go'),'Järgmine saar','⛵ Purjeta: '+islands[nx].name,()=>voyage(nx));
        else if(first)later(()=>say('Kõik saared läbitud! 🎖️','happy'),1500);
        btn(get('go'),'Meresaarte kaart','🗺️ Kaart',advHome);
        btn(get('go'),'Avaleht','⌂ Avaleht',home);
      });
    },1300);
  }
}

/* =====================================================================
   VIDEOD
   ===================================================================== */
function ytId(s){
  s=String(s||'').trim();
  const m=s.match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/);
  if(m)return m[1];
  return /^[\w-]{11}$/.test(s)?s:null;
}
function videos(){
  cancel();mode='video';
  screen('Avaleht',home,'📺 Videod');
  const mine=[...presetVideos.map(v=>({id:ytId(v.id),title:v.title,preset:1})).filter(v=>v.id),...store.get('videos',[])];
  get('stage').innerHTML='<h3>⭐ Minu videod</h3><div class="vgrid" id="vgrid"></div>'+
    '<h3 style="margin-top:14px">🔎 Otsi YouTube’ist</h3><div class="row vsearch" id="vsearch"></div>'+
    '<p class="note">Otsing avaneb uues aknas YouTube’is. Vaata koos täiskasvanuga! 👨‍👩‍👧</p>'+
    '<div class="row" id="pgate"></div><div id="parent" style="width:100%"></div>';
  if(!mine.length)get('vgrid').innerHTML='<p class="note" style="grid-column:1/-1">Siin pole veel videoid. Vanem saab neid lisada allpool „Vanema nurgas“.</p>';
  mine.forEach(v=>btn(get('vgrid'),'Vaata: '+v.title,'<img alt="" loading="lazy" src="https://i.ytimg.com/vi/'+v.id+'/hqdefault.jpg"><span>▶ '+escapeHtml(v.title)+'</span>',()=>playVideo(v.id),'vcard'));
  videoSearches.forEach(([i,n,q])=>btn(get('vsearch'),n,i+' '+n,()=>{tone(600,0,'triangle');window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(q),'_blank','noopener')}));
  btn(get('pgate'),'Vanema nurk','🔐 Vanema nurk',parentGate,'small');
  tell('Vali video.');
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function playVideo(id){
  cancel();
  const m=document.createElement('div');m.className='vmodal';m.setAttribute('role','dialog');m.setAttribute('aria-label','Video');
  m.innerHTML='<div class="vbox"><iframe src="https://www.youtube-nocookie.com/embed/'+id+'?rel=0&modestbranding=1&autoplay=1&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="YouTube video"></iframe><div class="row" id="vclose"></div></div>';
  document.body.append(m);
  const close=()=>{m.remove();removeEventListener('keydown',esc)};
  const esc=e=>{if(e.key==='Escape')close()};addEventListener('keydown',esc);
  btn(m.querySelector('#vclose'),'Sulge video','✖ Sulge',close);
  m.addEventListener('click',e=>{if(e.target===m)close()});
}
function parentGate(){
  const a=2+Math.floor(Math.random()*6),b=2+Math.floor(Math.random()*6),sum=a+b;
  const box=get('parent');box.innerHTML='<div class="parentbox"><b>Täiskasvanu kontroll: mitu on '+a+' + '+b+'?</b><div class="row" id="gateOpts"></div></div>';
  mix([sum,sum+1,sum-1,sum+2]).forEach(n=>btn(get('gateOpts'),String(n),String(n),bt=>{n===sum?parentPanel():fail(bt,'Vale vastus.')},'small'));
}
function parentPanel(){
  const box=get('parent');
  box.innerHTML='<div class="parentbox"><b>Lisa YouTube’i video</b><input id="vurl" placeholder="Kleebi YouTube’i link" inputmode="url"><input id="vtitle" placeholder="Pealkiri (nt Lastelaul)" maxlength="60"><div class="row" id="vadd"></div><div class="vlist" id="vlist"></div>'+
    '<p class="note">Lisatud videod salvestuvad ainult selles brauseris. Püsivalt saab neid lisada koodi algusesse (presetVideos).</p></div>';
  btn(get('vadd'),'Lisa video','➕ Lisa',()=>{
    const id=ytId(get('vurl').value),title=get('vtitle').value.trim()||'Video';
    if(!id){status('See ei paista olevat YouTube’i link.');boo();return}
    const list=store.get('videos',[]);if(!list.some(v=>v.id===id)){list.push({id,title});store.set('videos',list)}
    chord();videos();parentPanel();status('Video lisatud! ✅');
  });
  const list=store.get('videos',[]);
  list.forEach((v,k)=>{
    const row=document.createElement('div');row.innerHTML='<span>▶ '+escapeHtml(v.title)+'</span>';get('vlist').append(row);
    btn(row,'Eemalda '+v.title,'🗑️',()=>{list.splice(k,1);store.set('videos',list);videos();parentPanel()},'small');
  });
}

/* ---------- Käivitus ---------- */
addEventListener('resize',()=>{sizeFx();sizeSL()});
sizeFx();sizeSL();
if(!reduced()){for(let k=0;k<7;k++)fishes.push(makeFish());requestAnimationFrame(slTick)}
home();
setTimeout(()=>{say('Ahoi! Mina olen kapten Hüljes. 👋','happy');waveFlipper()},900);
</script>
